name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' }}

jobs:
  classify:
    name: Classify change evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      plan_json: ${{ steps.changes.outputs.plan_json }}
      matrix_json: ${{ steps.changes.outputs.matrix_json }}
      node_22_minimum: ${{ steps.changes.outputs.node_22_minimum }}
      pr_linux_core: ${{ steps.changes.outputs.pr_linux_core }}
      pr_linux_lifecycle: ${{ steps.changes.outputs.pr_linux_lifecycle }}
      pr_windows_lifecycle: ${{ steps.changes.outputs.pr_windows_lifecycle }}
      pr_macos_lifecycle: ${{ steps.changes.outputs.pr_macos_lifecycle }}
      test: ${{ steps.changes.outputs.test }}
      windows_unit: ${{ steps.changes.outputs.windows_unit }}
      renderer: ${{ steps.changes.outputs.renderer }}
      benchmarks: ${{ steps.changes.outputs.benchmarks }}
      full_certification: ${{ steps.changes.outputs.full_certification }}

    steps:
      - name: Check out complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed evidence domains
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan-workflow.mjs

  lineage:
    name: Migration lineage
    needs: classify
    uses: ./.github/workflows/database-migration-lineage.yml
    with:
      comparison-base: ${{ needs.classify.outputs.base_sha }}

  # Migrations, architecture, lint, and types are platform independent, so they
  # are proven once here instead of six times across the matrix. Every
  # expensive job depends on this, which keeps a typo from occupying the
  # Windows, macOS, and ARM runner pools that the rest of the matrix queues on.
  gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow syntax and expressions
        shell: bash
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$binary" -color

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify migrations, architecture, lint, and types
        run: npm run check:quality

      - name: Enforce the isolated browser-evidence CPU budget
        run: npm run test:browser-evidence-cpu-budget

  node-22-minimum:
    name: Node 22.13 minimum runtime
    runs-on: ubuntu-24.04
    needs: [classify, gate]
    if: needs.classify.outputs.node_22_minimum == 'true'
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      # Deliberately uncached: proving that npm ci itself resolves and installs
      # the locked graph on exactly Node 22.13 is this job's whole purpose, and
      # restoring a tree built elsewhere would prove nothing.
      - name: Install locked dependencies without a cache
        run: npm ci --engine-strict

      - name: Compile and execute Node runtime entry points
        run: npm run check:node-runtime

  pr-linux-core:
    name: Linux core and portable conformance
    if: needs.classify.outputs.pr_linux_core == 'true'
    runs-on: ubuntu-24.04
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux guardian toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run core suite with all-source coverage baselines
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Keep core failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-linux-core-results
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  pr-linux-lifecycle:
    name: Linux interaction and lifecycle
    if: needs.classify.outputs.pr_linux_lifecycle == 'true'
    runs-on: ubuntu-24.04
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux guardian toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2 dbus-daemon dbus-bin gnome-keyring

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run compact Electron/core bridge smoke under Xvfb
        if: needs.classify.outputs.renderer != 'true'
        run: >-
          xvfb-run --auto-servernum npm exec -- playwright test
          tests/e2e/core-bridge-smoke.spec.ts
          --project=isolated --workers=1
          --output=test-results/core-bridge-smoke

      - name: Run renderer display-sensitive interaction under Xvfb
        if: needs.classify.outputs.renderer == 'true'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      - name: Run renderer isolated interaction under Xvfb
        if: needs.classify.outputs.renderer == 'true'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run destructive runtime-recovery Electron sentinels under Xvfb
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep Linux sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-linux-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  pr-windows-lifecycle:
    name: Windows x64 lifecycle sentinel
    if: needs.classify.outputs.pr_windows_lifecycle == 'true'
    runs-on: windows-2025
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exclude the workspace from Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          # Node's os.tmpdir() follows TEMP/TMP, not RUNNER_TEMP. Keep copied
          # provider executables and SQLite fixtures in the excluded job tree.
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Run Windows lifecycle sentinels
        run: >-
          npm exec -- vitest run --maxWorkers=1
          tests/main/app-update-handoff.test.ts
          tests/main/app-update-startup.test.ts
          tests/main/runtime-owned-process-recovery.test.ts
          tests/main/runtime-process-containment-admission.test.ts
          tests/main/runtime-supervisor-lifecycle.test.ts
          tests/main/runtime-supervisor-windows-tree-recovery.test.ts
          tests/main/windows-runtime-job.test.ts
          tests/main/windows-update-supervisor.test.ts
          tests/main/windows-update-terminal-receipt.test.ts
          tests/server/runtime-shutdown-authority.test.ts

      - name: Run portable provider contracts on Windows
        run: npm run test:portable

      - name: Verify Windows provider discovery and shim transport
        run: npm run test:windows-codex

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run destructive runtime-recovery Electron sentinels
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep Windows sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-windows-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  pr-macos-lifecycle:
    name: macOS arm64 lifecycle sentinel
    if: needs.classify.outputs.pr_macos_lifecycle == 'true'
    runs-on: macos-15
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: arm64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Run macOS lifecycle sentinels
        run: >-
          npm exec -- vitest run --maxWorkers=1
          tests/main/app-update-handoff.test.ts
          tests/main/runtime-live-darwin-recovery.test.ts
          tests/main/runtime-owned-process-darwin-helper.test.ts
          tests/main/runtime-process-guardian-darwin.test.ts
          tests/main/runtime-supervisor-lifecycle.test.ts
          tests/main/terminal-darwin-ownership-boundary.test.ts
          tests/main/terminal-darwin-shutdown.test.ts
          tests/server/runtime-shutdown-authority.test.ts

      - name: Run portable provider contracts on macOS
        run: npm run test:portable

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run destructive runtime-recovery Electron sentinels
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep macOS sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-macos-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: ${{ matrix.label }}
    if: needs.classify.outputs.test == 'true'
    runs-on: ${{ matrix.runner }}
    needs: [classify, gate]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix_json) }}
      # Bound background certification without expanding native worker counts.
      max-parallel: ${{ github.event_name == 'schedule' && 2 || 6 }}
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-${{ matrix.artifact }}.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-${{ matrix.artifact }}.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-${{ matrix.artifact }}.json

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Real-time scanning inspects every file npm writes and every executable
      # the native Git, SQLite, and PTY fixtures spawn, which is the dominant
      # cost of both installing and testing on the hosted Windows images. The
      # runner user is an administrator and the workspace is discarded when the
      # job ends, so the exclusion is scoped to that throwaway tree.
      - name: Exclude the workspace from Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install Linux guardian toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2 dbus-daemon dbus-bin gnome-keyring

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run test:native-architecture

      - name: Run cross-platform performance smoke
        if: needs.classify.outputs.benchmarks == 'true'
        run: npm run benchmark:platform:smoke

      # Migrations, architecture, lint, and types are already proven by the
      # quality gate, so each platform runs only what is genuinely platform
      # dependent: the unit suite and the build.
      - name: Run the unit suite
        if: runner.os == 'macOS'
        # Bound process-heavy fixture contention while retaining every deadline.
        run: npm test -- --maxWorkers=2

      # Coverage runs the same suite as npm test, so Linux runs it once here
      # instead of running the suite twice.
      - name: Run the unit suite and enforce all-source coverage baselines
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: npm run test:coverage

      - name: Run the complete Linux ARM64 unit suite without duplicate coverage
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: npm test

      # Linux coverage, macOS units, and the sharded Windows x64 job already
      # execute every marked portable test. Windows ARM64 has no complete unit
      # signal, so it alone needs the generated portable subset here.
      - name: Run Windows ARM64 portable runtime and provider protocol suite
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: npm run test:portable

      # Every attempt is retained and any failed attempt fails the job at the
      # end. A pass after a failure is classified as a flake, never as success.
      - name: Repeat selected lifecycle invariants for nightly flake evidence
        id: lifecycle_repeat
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: >-
          npm run test:lifecycle-repeat --
          --iterations 3
          --output-directory test-results/nightly-lifecycle

      - name: Run opt-in Kimi through Claude integration
        if: github.event_name == 'schedule' && runner.os == 'Linux' && matrix.arch == 'x64'
        shell: bash
        env:
          INERTIA_KIMI_CODE_API_KEY: ${{ secrets.INERTIA_KIMI_CODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INERTIA_KIMI_CODE_API_KEY:-}" ]]; then
            echo "Kimi integration secret is unavailable; ordinary CI remains secret-free."
            exit 0
          fi
          INERTIA_RUN_KIMI_CLAUDE_INTEGRATION=1 \
            npm exec -- vitest run tests/server/kimi-claude-real-smoke.test.ts

      - name: Verify native Windows Codex discovery and shim launching
        if: runner.os == 'Windows'
        run: npm run test:windows-codex

      # The x64 unit signal runs in separate shard jobs, so unlike ARM64 this
      # matrix job has not executed an npm pretest hook before bundling. Build
      # the exact Job Object helper in this workspace before its integrity
      # snapshot and executable are consumed by the bundle and package.
      - name: Build Windows x64 runtime helper for the application bundle
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: npm run pretest

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --audit-level=high

      # The one build in the job. It carries the generated third-party notices
      # and the runtime guardian that packaging requires, but not the typecheck
      # the quality gate already ran. Everything below consumes this output, so
      # the packaging steps no longer rebuild it from source.
      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Package native Windows installer and unpacked app
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package native macOS containers and unpacked app
        if: runner.os == 'macOS'
        env:
          # The builder is configured for ad-hoc signing (identity "-"), so no
          # signing secret is exposed by enabling it for pull-request builds.
          CSC_FOR_PULL_REQUEST: "true"
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package Linux AppImage and unpacked app
        if: runner.os == 'Linux'
        run: npm run "${{ matrix.package_script }}"

      - name: Download checksummed packaged Windows N-1 installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          node scripts/ci/download-windows-n-minus-one.mjs \
            --current-version "$current_version" \
            --channel stable \
            --architecture "${{ matrix.arch }}" \
            --output-directory release/n-minus-one

      - name: Validate Linux AppImage identity, icons, and runtime resource
        if: runner.os == 'Linux'
        run: npm run validate:linux-package

      - name: Verify the packaged Linux guardian is static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          guardian="${{ matrix.unpacked_dir }}/resources/runtime/runtime-process-guardian"
          test -x "$guardian"
          if readelf --program-headers "$guardian" | grep -Fq 'INTERP'; then
            echo "The packaged Linux guardian unexpectedly has a program interpreter." >&2
            exit 1
          fi
          if readelf --dynamic "$guardian" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "The packaged Linux guardian unexpectedly has a dynamic dependency." >&2
            exit 1
          fi

      - name: Verify packaged Electron fuses
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app_path }}"
          test -e "$app"
          npm run verify:fuses -- "$app"

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Install N-1, upgrade in place, smoke, and uninstall Windows package
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_WINDOWS_N_MINUS_ONE_METADATA: release/n-minus-one/metadata.json
        run: npm run test:windows-installer-smoke

      - name: Prove AppImage and guardian runtime on pristine Ubuntu 22.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print0)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi
          artifact="$(basename -- "${appimages[0]}")"
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --volume "$PWD/release:/release:ro" \
            ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -euo pipefail -c '
              app="/release/$1"
              "$app" --appimage-version
              work="$(mktemp -d)"
              cd "$work"
              "$app" --appimage-extract >/dev/null
              guardian="squashfs-root/resources/runtime/runtime-process-guardian"
              test -x "$guardian"
              "$guardian" seccomp-selftest
              sleep 30 & child="$!"
              cleanup() {
                kill "$child" 2>/dev/null || true
                wait "$child" 2>/dev/null || true
              }
              trap cleanup EXIT
              identity="$("$guardian" identity "$child")"
              [[ "$identity" =~ ^[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*$ ]]
            ' bash "$artifact"

      - name: Configure Linux sandbox helper for smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${{ matrix.unpacked_dir }}/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"

      - name: Smoke native packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package-smoke

      - name: Smoke final macOS and Linux release containers
        if: runner.os == 'macOS'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: npm run test:release-container-smoke

      - name: Smoke final Linux AppImage default and fallback launches under Xvfb
        if: runner.os == 'Linux'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: xvfb-run --auto-servernum npm run test:release-container-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mac_app="${{ matrix.app_path }}"
          codesign --verify --deep --strict --verbose=2 "$mac_app"

      # The shared dependency cache deliberately excludes Electron's platform
      # payload. Download it outside Playwright's hook deadline so a cold cache
      # cannot consume the first display-sensitive suite's startup budget.
      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run display-sensitive Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      # Package evidence is already complete. Do not continue native work
      # after a failed phase whose fixture cleanup may be unconfirmed.
      - name: Run isolated Electron end-to-end tests
        if: runner.os != 'Linux'
        env:
          # Bound Windows load after hosted socket-buffer exhaustion.
          INERTIA_E2E_WORKERS: ${{ runner.os == 'Windows' && '1' || '2' }}
        run: npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run destructive runtime-recovery tests sequentially
        if: runner.os != 'Linux'
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Run display-sensitive Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      - name: Run isolated Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run destructive runtime-recovery tests sequentially under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep provider settings visual evidence
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-settings-screenshots
          path: test-results/**/provider-settings-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Measure desktop workloads
        if: (needs.classify.outputs.benchmarks == 'true') && runner.os != 'Linux'
        run: npm run benchmark:desktop:built

      - name: Measure desktop workloads under Xvfb
        if: (needs.classify.outputs.benchmarks == 'true') && runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run benchmark:desktop:built

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ matrix.artifact }}
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep cross-platform performance evidence
        if: always() && (needs.classify.outputs.benchmarks == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.artifact }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 14

      - name: Keep nightly lifecycle repetition and flake evidence
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-lifecycle-${{ matrix.artifact }}
          path: test-results/nightly-lifecycle
          if-no-files-found: warn
          retention-days: 30

      - name: Fail certification when any lifecycle repetition failed
        if: always() && github.event_name == 'schedule' && steps.lifecycle_repeat.outcome == 'failure'
        shell: bash
        run: |
          echo "At least one retained lifecycle attempt failed or flaked." >&2
          exit 1

  windows-unit:
    name: Windows unit tests (${{ matrix.shard }}/4)
    if: needs.classify.outputs.windows_unit == 'true'
    runs-on: windows-2025
    needs: [classify, gate]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Longest-processing-time sharding uses only the bounded manifest from a
      # successful Windows run. New files get the recorded p90 duration rather
      # than an optimistic zero. Each shard remains single-worker because #74
      # proved that concurrent hosted-Windows fixtures contend for resources.
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exclude the workspace from Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Windows unit-test shard
        run: npm run test:windows:shard -- --shard=${{ matrix.shard }}/4

      - name: Keep Windows shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-windows-unit-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  merge-ready:
    name: merge-ready
    if: always()
    needs: [classify, gate, lineage, node-22-minimum, pr-linux-core, pr-linux-lifecycle, pr-windows-lifecycle, pr-macos-lifecycle, test, windows-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require complete exact-candidate evidence
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/merge-ready.mjs

  report-nightly-failure:
    name: Report nightly lifecycle certification failure
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.merge-ready.result != 'success'
    needs: merge-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open or update the tracked nightly failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Nightly lifecycle certification failed";
            const marker = "<!-- inertia-nightly-lifecycle-certification -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, filter: "latest", per_page: 100 },
            );
            const failed = jobs.filter((job) =>
              ["failure", "cancelled", "timed_out", "action_required"].includes(job.conclusion)
            );
            const failureEvidence = failed.flatMap((job) => {
              const steps = (job.steps || [])
                .filter((step) => ["failure", "cancelled", "timed_out"].includes(step.conclusion))
                .map((step) => `${job.name}: ${step.name}`);
              return steps.length > 0 ? steps : [`${job.name}: ${job.conclusion}`];
            });
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              !issue.pull_request && issue.user?.login === "github-actions[bot]" && issue.body?.includes(marker)
            );
            const priorComments = existing
              ? await github.paginate(github.rest.issues.listComments, {
                  ...context.repo,
                  issue_number: existing.number,
                  per_page: 100,
                })
              : [];
            const priorOccurrences = existing
              ? 1 + priorComments.filter((comment) => comment.body?.includes(marker)).length
              : 0;
            const manifestUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/package.json`;
            const body = [
              marker,
              "The scheduled six-target lifecycle certification did not complete cleanly.",
              "Mixed repeat results are treated as failures and retained as flake evidence.",
              "",
              `- Exact SHA: \`${context.sha}\``,
              `- Prior occurrences tracked here: ${priorOccurrences}`,
              `- [Runner logs and retained artifacts](${runUrl})`,
              `- [Provider dependency versions bound to this SHA](${manifestUrl})`,
              "",
              "### Failing invariant / platform evidence",
              ...(failureEvidence.length > 0
                ? failureEvidence.map((value) => `- ${value}`)
                : ["- The workflow stopped before bounded job evidence was available."]),
              "",
              "Provider/version is only applicable when named by a failed provider step; exact",
              "locked versions remain bound to the linked SHA. This issue contains no runner",
              "output, prompts, paths, provider payloads, environment values, or credentials.",
            ].join("\n");
            if (!existing) {
              await github.rest.issues.create({ ...context.repo, title, body });
              return;
            }
            if (existing.state !== "open") {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: "open",
              });
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.number,
              body,
            });
