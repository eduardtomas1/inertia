name: Windows ARM64 release diagnosis

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reference tag for the investigation (never published)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-arm64-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Measure fixture and native cleanup phases
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      CI: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use isolated temporary directory
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          New-Item -ItemType Directory -Path diagnostics -Force
      - name: Exclude disposable workspace from Defender
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install locked dependencies
        id: dependencies
        uses: ./.github/actions/install-dependencies
      - name: Prepare native fixtures
        run: npm run pretest
      - name: Measure all phases of the actual 12000-file fixture
        run: |
          node --experimental-strip-types scripts/diagnose-checkpoint-fixture.mjs | Tee-Object -FilePath diagnostics/checkpoint-phases.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat native shell fallback without changing its deadline
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $failedSamples = 0
          for ($sample = 1; $sample -le 10; $sample++) {
            Write-Output "Native terminal sample $sample"
            node node_modules/vitest/vitest.mjs run tests/server/windows-managed-terminal-native.test.ts -t 'ComSpec-unset basename shell fallback'
            if ($LASTEXITCODE -ne 0) { $failedSamples++ }
          }
          if ($failedSamples -gt 0) { throw "$failedSamples native terminal samples failed" }
      - name: Prepare Electron and build the diagnostic app
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node -e "console.log(require('electron'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat delayed-answer shutdown with bounded owner tracing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node node_modules/@playwright/test/cli.js test tests/e2e/transcript-turn-anchor.spec.ts --project=isolated --workers=1 --repeat-each=25 --retries=0 -g 'keeps a clamped accepted turn pending'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep phase and process ownership evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release76-arm64-diagnosis-${{ github.run_attempt }}
          path: |
            diagnostics
            test-results
          if-no-files-found: error
          retention-days: 7
