name: Native lifecycle diagnostic

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [windows, macos-intel]
        default: windows

permissions:
  contents: read

jobs:
  windows-action-stop:
    name: Repeat immediate managed action stop
    if: inputs.target != 'macos-intel'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match Windows CI temporary directories
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Match Windows CI Defender exclusions
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install locked dependencies
        run: npm ci
      - name: Build native runtime helpers
        run: npm run pretest
      - name: Repeat the unchanged runtime integration suite
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path diagnostic-results | Out-Null
          $failures = 0
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Output "Attempt $attempt of 5"
            npm exec -- vitest run tests/server/runtime.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="diagnostic-results/attempt-$attempt.json" 2>&1 | Tee-Object -FilePath "diagnostic-results/attempt-$attempt.log"
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          Write-Output "$failures of 5 attempts failed"
          if ($failures -gt 0) { exit 1 }
      - name: Upload synthetic fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-action-stop-diagnostic
          path: diagnostic-results
          retention-days: 3
          if-no-files-found: warn

  macos-kimi:
    name: Repeat Intel Mac Kimi authentication
    if: inputs.target == 'macos-intel'
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build the native application bundle
        run: npm run build:packaged
      - name: Prepare Electron binary
        run: node -e "console.log(require('electron'))"
      - name: Repeat Kimi with its neighboring isolated fixture
        run: npm exec -- playwright test tests/e2e/kimi-terminal-auth.spec.ts tests/e2e/core-bridge-smoke.spec.ts --project=isolated --repeat-each=6 --max-failures=1 --output=test-results/macos-kimi
      - name: Upload synthetic fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-kimi-diagnostic
          path: test-results/macos-kimi
          retention-days: 3
          if-no-files-found: warn
