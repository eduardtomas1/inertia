name: Install Linux packages
description: Install pinned apt packages from a per-image cache, downloading them only when the runner image changes.

inputs:
  packages:
    description: Space-separated apt packages, optionally pinned with =version.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the package cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        digest="$(printf '%s' "$PACKAGES" | tr -s ' ' '\n' | sort | sha256sum | cut -c1-16)"
        printf 'key=linux-packages-%s-%s-%s-%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_ARCH" "$digest" >> "$GITHUB_OUTPUT"
        printf 'dir=%s\n' "$RUNNER_TEMP/linux-packages" >> "$GITHUB_OUTPUT"

    - name: Restore cached packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}

    - name: Download packages
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        PACKAGE_DIR: ${{ steps.key.outputs.dir }}
      run: |
        set -euo pipefail
        for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do [ -f "$sources" ] && sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$sources"; done
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get clean
        read -r -a packages <<< "$PACKAGES"
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300 install --download-only --no-install-recommends --yes "${packages[@]}"
        mkdir -p "$PACKAGE_DIR"
        find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} "$PACKAGE_DIR/" \;
        touch "$PACKAGE_DIR/.complete"

    - name: Save downloaded packages
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}

    - name: Install packages
      shell: bash
      env:
        PACKAGE_DIR: ${{ steps.key.outputs.dir }}
      run: |
        set -euo pipefail
        [ -f "$PACKAGE_DIR/.complete" ] || { echo "The package cache is incomplete." >&2; exit 1; }
        shopt -s nullglob
        debs=("$PACKAGE_DIR"/*.deb)
        if [ "${#debs[@]}" -gt 0 ]; then
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Dpkg::Options::=--force-confold install --no-download --no-install-recommends --yes "${debs[@]}"
        fi
