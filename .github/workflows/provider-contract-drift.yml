name: PR309 Intel initial-startup capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-startup:
    name: Original PR309 display and isolated startup sequence
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CI: "true"
      INERTIA_E2E_WORKERS: "2"
    steps:
      - name: Check out exact failing-source diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build instrumented native application bundle
        run: npm run build:packaged
      - name: Prepare Electron and private diagnostic destination
        run: |
          node -e "console.log(require('electron'))"
          mkdir -m 700 "$RUNNER_TEMP/pr309-native-startup"
          echo "INERTIA_STARTUP_CAPTURE_DIRECTORY=$RUNNER_TEMP/pr309-native-startup" >> "$GITHUB_ENV"
      - name: Run original display-sensitive prefix
        id: display
        run: npm exec -- playwright test --project=display-sensitive --max-failures=1 --output=test-results/display-sensitive
      - name: Run original complete isolated sequence with two workers
        id: isolated
        run: npm exec -- playwright test --project=isolated --max-failures=1 --output=test-results/isolated
      - name: Record compact outcome even when scenarios pass
        if: always()
        env:
          CAPTURE_SOURCE_SHA: ${{ github.sha }}
          DISPLAY_OUTCOME: ${{ steps.display.outcome }}
          ISOLATED_OUTCOME: ${{ steps.isolated.outcome }}
        run: |
          node -e 'const fs=require("node:fs"), p=require("node:path"); const root=process.env.INERTIA_STARTUP_CAPTURE_DIRECTORY || p.join(process.env.RUNNER_TEMP,"pr309-native-startup"); fs.mkdirSync(root,{recursive:true,mode:0o700}); fs.writeFileSync(p.join(root,"outcome.json"),JSON.stringify({sourceSha:process.env.CAPTURE_SOURCE_SHA,baseline:"f1b423a6",display:process.env.DISPLAY_OUTCOME,isolated:process.env.ISOLATED_OUTCOME,nativeRecordsPresent:fs.existsSync(p.join(root,"native-phase.jsonl"))}),{mode:0o600})'
      - name: Retain fixed native startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr309-intel-startup-capture
          path: ${{ runner.temp }}/pr309-native-startup
          retention-days: 3
          if-no-files-found: error
      - name: Retain synthetic scenario failure trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr309-intel-scenario-failure
          path: test-results
          retention-days: 3
          if-no-files-found: warn
