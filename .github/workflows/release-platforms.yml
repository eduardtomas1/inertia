name: Release76 unit-prefix lifecycle diagnosis

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen reference tag for diagnosis only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release76-focused-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Diagnose ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ARM64 unit prefix
            runner: windows-11-arm
            mode: windows-unit-prefix
            workers: 1
            unit_minutes: 100
            job_minutes: 220
          - label: macOS ARM64 unit prefix
            runner: macos-15
            mode: macos-unit-prefix
            workers: 2
            unit_minutes: 35
            job_minutes: 155
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INERTIA_DIAGNOSTIC_RETAIN_BASELINES: "1"
      INERTIA_CI_TIMINGS: "true"
      INERTIA_E2E_WORKERS: ${{ matrix.workers }}
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify production source matches the frozen candidate
        run: git diff --exit-code 3262f37a957a910fb8a50d2c3a12b8a75c125861 -- src scripts package.json package-lock.json CHANGELOG.md
      # Actions has already loaded this diagnostic graph. Unit contracts must
      # read the actual frozen release workflow, never this manual probe.
      - name: Restore frozen release workflow for contract-test file reads
        run: |
          git show 3262f37a957a910fb8a50d2c3a12b8a75c125861:.github/workflows/release-platforms.yml > .github/workflows/release-platforms.yml
          git diff --exit-code 3262f37a957a910fb8a50d2c3a12b8a75c125861 -- .github/workflows/release-platforms.yml src scripts package.json package-lock.json CHANGELOG.md
      - name: Prepare Windows isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          try { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"; Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" } catch { Write-Output "Defender exclusion unavailable" }
      - name: Install reviewed dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build exact diagnostic app
        timeout-minutes: 10
        run: npm run build:packaged
      - name: Observe host before the baseline
        run: node tests/support/release76-host-observation.mjs before-baseline
      - name: Match release desktop benchmark precondition
        timeout-minutes: 10
        run: npm run benchmark:desktop:built
      - name: Capture same-runner lifecycle baseline before unit workload
        timeout-minutes: 10
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node node_modules/@playwright/test/cli.js test tests/e2e/watcher.spec.ts --project=isolated --output=test-results/pre-unit --retries=0
          else
            node node_modules/@playwright/test/cli.js test tests/e2e/app-update-viability.spec.ts tests/e2e/layout.spec.ts tests/e2e/multi-spawn.spec.ts --project=isolated --output=test-results/pre-unit --retries=0 -g 'the real update validator|searches Help, moves|launches two truthful routes|starts the judge while'
          fi
      - name: Prepare checksum-verified NSIS unit-test compiler
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node -e "require('app-builder-lib/out/toolsets/windows').getMakeNsisPath(undefined).then(() => console.log('NSIS test compiler ready'))"
      - name: Observe host immediately before the unit workload
        run: node tests/support/release76-host-observation.mjs before-unit
      - name: Reproduce complete native unit workload without changing its tests
        id: native_unit
        timeout-minutes: ${{ matrix.unit_minutes }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm test -- --maxWorkers=2
          else
            npm test
          fi
      - name: Observe host after unit workload or failure
        if: always()
        run: node tests/support/release76-host-observation.mjs after-unit-or-failure
      - name: Rebuild the same production bundle after unit workload as in release
        timeout-minutes: 10
        run: npm run build:packaged
      - name: Match release foreground phase before isolated apps
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test --project=display-sensitive --output=test-results/display-sensitive --retries=0
      - name: Observe host before the isolated sequence
        run: node tests/support/release76-host-observation.mjs before-isolated
      - name: Probe complete isolated sequence with release worker and deadline settings
        timeout-minutes: 45
        run: node node_modules/@playwright/test/cli.js test --project=isolated --output=test-results/isolated --retries=0
      - name: Observe host after desktop sequence or failure
        if: always()
        run: node tests/support/release76-host-observation.mjs after-desktop-or-failure
      - name: Retain focused failure and process diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release76-focused-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            test-results
            ci-test-timings
            performance-results
          if-no-files-found: warn
          retention-days: 7
