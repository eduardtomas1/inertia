name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "canary-v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-15-intel
            platform: macos-x64
            arch: x64
            dist_script: dist:release:mac:x64
            timeout_minutes: 55
            app_path: release/mac/Inertia.app
          - label: macOS arm64
            runner: macos-15
            platform: macos-arm64
            arch: arm64
            dist_script: dist:release:mac
            timeout_minutes: 50
            app_path: release/mac-arm64/Inertia.app
          - label: Windows x64
            runner: windows-2025
            platform: windows-x64
            arch: x64
            dist_script: dist:release:win
            timeout_minutes: 60
            app_path: release/win-unpacked/Inertia.exe
            windows_asset_suffix: ""
          - label: Windows ARM64
            runner: windows-11-arm
            platform: windows-arm64
            arch: arm64
            dist_script: dist:release:win:arm64
            timeout_minutes: 75
            app_path: release/win-arm64-unpacked/Inertia.exe
            windows_asset_suffix: .arm64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux-x64
            arch: x64
            dist_script: dist:release:linux
            timeout_minutes: 55
            app_path: release/linux-unpacked/inertia
            unpacked_dir: release/linux-unpacked
            docker_platform: linux/amd64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            dist_script: dist:release:linux:arm64
            timeout_minutes: 65
            app_path: release/linux-arm64-unpacked/inertia
            unpacked_dir: release/linux-arm64-unpacked
            docker_platform: linux/arm64
    env:
      CI: "true"
      INERTIA_RELEASE_CHANNEL: ${{ startsWith(inputs.release_tag || github.ref_name, 'canary-v') && 'canary' || 'stable' }}

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUSH_EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          release_ref="refs/tags/$RELEASE_TAG"
          event_sha="${PUSH_EVENT_SHA:-$(git rev-parse "$release_ref")}"
          RELEASE_REF="$release_ref" RELEASE_EVENT_SHA="$event_sha" node scripts/validate-release.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux guardian toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run test:native-architecture

      - name: Typecheck, unit test, and build
        run: npm run check

      - name: Run portable runtime and provider protocol suite
        run: npm run test:portable

      - name: Refresh Windows app bundle after portable helper rebuild
        if: runner.os == 'Windows'
        run: npm run build:bundle

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm exec -- playwright test

      - name: Run Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test

      - name: Prepare temporary macOS notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.MACOS_APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_BASE64:-}" ]]; then
            exit 0
          fi
          key_path="$RUNNER_TEMP/inertia-notarization-key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build macOS release package
        if: runner.os == 'macOS'
        env:
          DIST_SCRIPT: ${{ matrix.dist_script }}
          INERTIA_RELEASE_PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              unset "$name"
            fi
          done
          npm run "$DIST_SCRIPT"

      - name: Build Windows release package
        if: runner.os == 'Windows'
        env:
          DIST_SCRIPT: ${{ matrix.dist_script }}
          INERTIA_RELEASE_PLATFORM: ${{ matrix.platform }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              unset "$name"
            fi
          done
          npm run "$DIST_SCRIPT"

      - name: Build Linux release package
        if: runner.os == 'Linux'
        env:
          DIST_SCRIPT: ${{ matrix.dist_script }}
          INERTIA_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: npm run "$DIST_SCRIPT"

      - name: Validate Linux AppImage identity, icons, and runtime resource
        if: runner.os == 'Linux'
        run: npm run validate:linux-package

      - name: Verify the packaged Linux guardian is static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          guardian="${{ matrix.unpacked_dir }}/resources/runtime/runtime-process-guardian"
          test -x "$guardian"
          if readelf --program-headers "$guardian" | grep -Fq 'INTERP'; then
            echo "The packaged Linux guardian unexpectedly has a program interpreter." >&2
            exit 1
          fi
          if readelf --dynamic "$guardian" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "The packaged Linux guardian unexpectedly has a dynamic dependency." >&2
            exit 1
          fi

      - name: Verify packaged Electron fuses
        run: |
          set -euo pipefail
          app="${{ matrix.app_path }}"
          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            case "$RUNNER_OS" in
              Linux) app="${app%/inertia}/inertia-canary" ;;
              Windows) app="${app%/Inertia.exe}/Inertia Canary.exe" ;;
              macOS) app="${app%/Inertia.app}/Inertia Canary.app" ;;
              *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi
          test -e "$app"
          npm run verify:fuses -- "$app"

      - name: Normalize Windows release filename
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            expected="release/Inertia.Canary.Setup.${version}${{ matrix.windows_asset_suffix }}.exe"
          else
            expected="release/Inertia.Setup.${version}${{ matrix.windows_asset_suffix }}.exe"
          fi
          if [[ ! -f "$expected" ]]; then
            mapfile -d '' -t generated < <(find release -maxdepth 1 -type f -name '*.exe' -print0)
            if [[ "${#generated[@]}" -ne 1 ]]; then
              echo "Expected exactly one generated Windows installer; found ${#generated[@]}." >&2
              exit 1
            fi
            cp -- "${generated[0]}" "$expected"
          fi

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Install, smoke, and uninstall Windows package
        if: runner.os == 'Windows'
        run: npm run test:windows-installer-smoke

      - name: Prove AppImage and guardian runtime on pristine Ubuntu 22.04
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mapfile -d '' -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print0)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi
          artifact="$(basename -- "${appimages[0]}")"
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --volume "$PWD/release:/release:ro" \
            ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -euo pipefail -c '
              app="/release/$1"
              "$app" --appimage-version
              work="$(mktemp -d)"
              cd "$work"
              "$app" --appimage-extract >/dev/null
              guardian="squashfs-root/resources/runtime/runtime-process-guardian"
              test -x "$guardian"
              "$guardian" seccomp-selftest
              sleep 30 & child="$!"
              cleanup() {
                kill "$child" 2>/dev/null || true
                wait "$child" 2>/dev/null || true
              }
              trap cleanup EXIT
              identity="$("$guardian" identity "$child")"
              [[ "$identity" =~ ^[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*$ ]]
            ' bash "$artifact"

      - name: Configure Linux sandbox helper for smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${{ matrix.unpacked_dir }}/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"

      - name: Smoke native packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package-smoke

      - name: Smoke final macOS and Linux release containers
        if: runner.os == 'macOS'
        run: npm run test:release-container-smoke

      - name: Smoke final Linux AppImage default and fallback launches under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:release-container-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mac_app="${{ matrix.app_path }}"
          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            mac_app="${mac_app%/Inertia.app}/Inertia Canary.app"
          fi
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          if [[ -n "${CSC_LINK:-}" ]]; then
            codesign --display --verbose=2 "$mac_app" 2>&1 | grep -q "Authority=Developer ID Application:"
            xcrun stapler validate "$mac_app"
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}

      - name: Verify Windows Authenticode signature when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            $suffix = "${{ matrix.windows_asset_suffix }}"
            $prefix = if ($env:INERTIA_RELEASE_CHANNEL -eq "canary") { "Inertia.Canary.Setup" } else { "Inertia.Setup" }
            $signature = Get-AuthenticodeSignature "release/$prefix.$((Get-Content package.json | ConvertFrom-Json).version)$suffix.exe"
            if ($signature.Status -ne "Valid") {
              throw "The Windows release signature is not valid: $($signature.Status)"
            }
          }

      - name: Stage exact release assets and checksums
        env:
          INERTIA_RELEASE_STAGE_DIR: ${{ runner.temp }}/inertia-release-stage
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release-assets.mjs stage "$RELEASE_PLATFORM"

      - name: Keep release build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/inertia-release-stage/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ matrix.platform }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: Publish exact-tag release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      attestations: write
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      INERTIA_RELEASE_CHANNEL: ${{ startsWith(inputs.release_tag || github.ref_name, 'canary-v') && 'canary' || 'stable' }}

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUSH_EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          release_ref="refs/tags/$RELEASE_TAG"
          event_sha="${PUSH_EVENT_SHA:-$(git rev-parse "$release_ref")}"
          RELEASE_REF="$release_ref" RELEASE_EVENT_SHA="$event_sha" node scripts/validate-release.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked release-validation dependencies
        run: npm ci --ignore-scripts

      - name: Download macOS release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: ${{ runner.temp }}/inertia-release-assets/macos-arm64

      - name: Download macOS x64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x64
          path: ${{ runner.temp }}/inertia-release-assets/macos-x64

      - name: Download Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/inertia-release-assets/windows-x64

      - name: Download Windows ARM64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-arm64
          path: ${{ runner.temp }}/inertia-release-assets/windows-arm64

      - name: Download Linux release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: ${{ runner.temp }}/inertia-release-assets/linux-x64

      - name: Download Linux ARM64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-arm64
          path: ${{ runner.temp }}/inertia-release-assets/linux-arm64

      - name: Verify and consolidate release assets
        env:
          INERTIA_RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/inertia-release-assets
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/release-assets.mjs finalize

      - name: Prepare atomic Canary feed metadata
        if: env.INERTIA_RELEASE_CHANNEL == 'canary'
        env:
          INERTIA_CANARY_ASSET_DIR: ${{ runner.temp }}/inertia-release-assets/final
          INERTIA_CANARY_FEED_DIR: ${{ runner.temp }}/inertia-canary-feed
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/prepare-canary-feed.mjs

      - name: Keep exact Canary feed metadata
        if: env.INERTIA_RELEASE_CHANNEL == 'canary'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-feed-${{ inputs.release_tag || github.ref_name }}
          path: ${{ runner.temp }}/inertia-canary-feed
          if-no-files-found: error
          retention-days: 14

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/inertia-release-assets/final/*

      - name: Upload without replacing existing assets
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/inertia-release-assets/final
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' -t assets < <(find "$ASSET_DIRECTORY" -maxdepth 1 -type f -print0 | sort -z)
          checksum_file="$ASSET_DIRECTORY/SHA256SUMS.txt"
          if [[ ! -f "$checksum_file" ]]; then
            echo "The consolidated checksum manifest is missing." >&2
            exit 1
          fi
          checksum_entries="$(wc -l < "$checksum_file" | tr -d '[:space:]')"
          if [[ "${#assets[@]}" -ne "$((checksum_entries + 1))" ]]; then
            echo "The consolidated asset set does not match SHA256SUMS.txt." >&2
            exit 1
          fi
          (cd "$ASSET_DIRECTORY" && sha256sum --check --strict SHA256SUMS.txt)

          release_json="$RUNNER_TEMP/inertia-release.json"
          load_release_by_tag() {
            local matches match_count
            matches="$(
              gh api --paginate -H "Cache-Control: no-cache" \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]'
            )"
            match_count="$(jq 'length' <<< "$matches")"
            if [[ "$match_count" -gt 1 ]]; then
              echo "Multiple releases exist for $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ "$match_count" -eq 0 ]]; then
              return 1
            fi
            jq '.[0]' <<< "$matches" > "$release_json"
          }

          load_release_by_tag_with_retry() {
            local attempt delay
            delay=1
            for attempt in {1..7}; do
              if load_release_by_tag; then
                return 0
              fi
              if [[ "$attempt" -eq 7 ]]; then
                break
              fi
              echo "Release $RELEASE_TAG is not visible yet; retrying in ${delay}s."
              sleep "$delay"
              if [[ "$delay" -lt 8 ]]; then
                delay="$((delay * 2))"
              fi
            done
            return 1
          }

          if ! load_release_by_tag; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Inertia $RELEASE_TAG" \
              --generate-notes
            if ! load_release_by_tag_with_retry; then
              echo "The newly-created draft release could not be found." >&2
              exit 1
            fi
          fi

          if [[ "$(jq -r '.tag_name' "$release_json")" != "$RELEASE_TAG" ]]; then
            echo "GitHub returned a release for an unexpected tag." >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft' "$release_json")" != true ]]; then
            echo "Refusing to replace or modify the published release $RELEASE_TAG." >&2
            exit 1
          fi
          release_id="$(jq -r '.id' "$release_json")"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid release identifier." >&2
            exit 1
          fi

          declare -A local_assets=()
          for path in "${assets[@]}"; do
            name="$(basename "$path")"
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Unsafe local release asset name." >&2
              exit 1
            fi
            if [[ -n "${local_assets[$name]+present}" ]]; then
              echo "Duplicate local release asset name: $name" >&2
              exit 1
            fi
            local_assets["$name"]="$path"
          done

          verify_directory="$(mktemp -d "$RUNNER_TEMP/inertia-existing-release.XXXXXX")"
          declare -A remote_assets=()
          if ! jq -e 'all(.assets[]; .name | test("^[A-Za-z0-9._-]+$"))' "$release_json" >/dev/null; then
            echo "Draft release contains an unsafe asset name." >&2
            exit 1
          fi
          while IFS=$'\t' read -r name size; do
            [[ -n "$name" ]] || continue
            if [[ -z "${local_assets[$name]+present}" ]]; then
              echo "Draft release contains unexpected asset: $name" >&2
              exit 1
            fi
            if [[ -n "${remote_assets[$name]+present}" ]]; then
              echo "Draft release contains a duplicate asset name: $name" >&2
              exit 1
            fi
            local_path="${local_assets[$name]}"
            if [[ "$(stat -c '%s' "$local_path")" != "$size" ]]; then
              echo "Draft release asset size differs from the local build: $name" >&2
              exit 1
            fi
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$verify_directory"
            if [[ "$(sha256sum "$verify_directory/$name" | cut -d ' ' -f 1)" != "$(sha256sum "$local_path" | cut -d ' ' -f 1)" ]]; then
              echo "Draft release asset digest differs from the local build: $name" >&2
              exit 1
            fi
            remote_assets["$name"]=present
          done < <(jq -r '.assets[] | [.name, .size] | @tsv' "$release_json")

          for path in "${assets[@]}"; do
            name="$(basename "$path")"
            if [[ -z "${remote_assets[$name]+present}" ]]; then
              gh release upload "$RELEASE_TAG" "$path" --repo "$GITHUB_REPOSITORY"
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          if [[ "$(jq -r '.draft' "$release_json")" != true ]]; then
            echo "The release stopped being a draft before final verification." >&2
            exit 1
          fi
          if ! jq -e 'all(.assets[]; .name | test("^[A-Za-z0-9._-]+$"))' "$release_json" >/dev/null; then
            echo "The final draft contains an unsafe asset name." >&2
            exit 1
          fi
          mapfile -t final_remote_names < <(jq -r '.assets[].name' "$release_json" | sort)
          mapfile -t final_local_names < <(printf '%s\n' "${!local_assets[@]}" | sort)
          if [[ "${#final_remote_names[@]}" -ne "${#final_local_names[@]}" ]] \
            || [[ "$(printf '%s\n' "${final_remote_names[@]}")" != "$(printf '%s\n' "${final_local_names[@]}")" ]]; then
            echo "The final draft release asset set is not exact." >&2
            exit 1
          fi

          final_verify_directory="$(mktemp -d "$RUNNER_TEMP/inertia-final-release.XXXXXX")"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$final_verify_directory"
          mapfile -d '' -t downloaded < <(find "$final_verify_directory" -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#downloaded[@]}" -ne "${#assets[@]}" ]]; then
            echo "The final draft download did not contain the exact asset count." >&2
            exit 1
          fi
          for name in "${final_local_names[@]}"; do
            if [[ "$(sha256sum "$final_verify_directory/$name" | cut -d ' ' -f 1)" != "$(sha256sum "${local_assets[$name]}" | cut -d ' ' -f 1)" ]]; then
              echo "Final draft release verification failed for $name." >&2
              exit 1
            fi
          done

          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  publish-canary-feed:
    name: Publish atomic Canary feed
    needs: upload
    if: ${{ startsWith(inputs.release_tag || github.ref_name, 'canary-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact release implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact Canary feed metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canary-feed-${{ inputs.release_tag || github.ref_name }}
          path: ${{ runner.temp }}/inertia-canary-feed

      - name: Publish monotonic immutable metadata commit
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_DIRECTORY: ${{ runner.temp }}/inertia-canary-feed
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            feed_worktree="$(mktemp -d "$RUNNER_TEMP/inertia-canary-feed.XXXXXX")"
            git -C "$feed_worktree" init
            git -C "$feed_worktree" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            set +e
            git -C "$feed_worktree" ls-remote --exit-code --heads origin canary-feed >/dev/null
            remote_status=$?
            set -e
            if [[ "$remote_status" -eq 0 ]]; then
              git -C "$feed_worktree" fetch --force --depth=1 origin canary-feed
              git -C "$feed_worktree" checkout -B canary-feed FETCH_HEAD
            elif [[ "$remote_status" -eq 2 ]]; then
              git -C "$feed_worktree" checkout --orphan canary-feed
            else
              echo "Unable to read the current Canary feed head." >&2
              exit "$remote_status"
            fi

            set +e
            if [[ -f "$feed_worktree/canary-status.json" ]]; then
              node scripts/validate-canary-feed-advance.mjs \
                "$feed_worktree/canary-status.json" \
                "$FEED_DIRECTORY/canary-status.json"
            else
              node scripts/validate-canary-feed-advance.mjs \
                "$FEED_DIRECTORY/canary-status.json"
            fi
            advance_status=$?
            set -e
            if [[ "$advance_status" -eq 2 ]]; then
              exit 0
            elif [[ "$advance_status" -ne 0 ]]; then
              exit "$advance_status"
            fi

            find "$feed_worktree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            cp -- "$FEED_DIRECTORY"/* "$feed_worktree"/
            git -C "$feed_worktree" add --all
            git -C "$feed_worktree" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish Canary feed ${{ inputs.release_tag || github.ref_name }}"
            if git -C "$feed_worktree" push origin HEAD:canary-feed; then
              exit 0
            fi
            echo "Canary feed head advanced concurrently; retrying from the winner ($attempt/5)."
          done
          echo "Unable to publish the Canary feed after five concurrent updates." >&2
          exit 1

  notify-discord:
    name: Notify Discord
    needs: upload
    if: ${{ !startsWith(inputs.release_tag || github.ref_name, 'canary-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Send Discord release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "Discord release notifications are not configured; skipping."
            exit 0
          fi

          release_json="$(gh api -H "Cache-Control: no-cache" "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          release_name="$(jq -r '.name // empty' <<< "$release_json")"
          release_url="$(jq -r '.html_url // empty' <<< "$release_json")"
          if [[ -z "$release_name" ]]; then
            release_name="Inertia $RELEASE_TAG"
          fi
          if [[ -z "$release_url" ]]; then
            release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          fi

          RELEASE_NAME="$release_name" RELEASE_URL="$release_url" node <<'NODE'
          const content = [
            `Nova versio publicada a **${process.env.REPO_NAME}**:`,
            `**${process.env.RELEASE_NAME}** (${process.env.RELEASE_TAG})`,
            process.env.RELEASE_URL,
          ].join("\n");
          const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ content }),
          });
          if (!response.ok) {
            throw new Error(`Discord webhook returned HTTP ${response.status}.`);
          }
          NODE
