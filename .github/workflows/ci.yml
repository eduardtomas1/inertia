name: Manual issue 323 streaming attribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-windows-x64.json
    defaults:
      run:
        shell: pwsh
        working-directory: application
    steps:
      - name: Check out isolated instrumentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out immutable failed production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc4f60e1dc4a538d05c3af3773e7e67a3e02bbb
          path: application
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Match the original disposable Windows workspace exclusions
        continue-on-error: true
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install original reviewed dependency graph
        run: npm ci --engine-strict
      - name: Build original production source before any instrumentation
        run: npm run build:bundle
      - name: Record source and production bundle identity
        run: |
          if ((git rev-parse HEAD) -ne '0fc4f60e1dc4a538d05c3af3773e7e67a3e02bbb') { throw 'Wrong source' }
          node ../diagnostic/scripts/diagnostics/verify-323-streaming-source.mjs before
          if ($LASTEXITCODE -ne 0) { throw "Invalid post-build source evidence" }
          New-Item -ItemType Directory -Force diagnostic-evidence | Out-Null
          git rev-parse HEAD | Set-Content diagnostic-evidence/source.txt
          Get-ChildItem out -File -Recurse | Sort-Object FullName | ForEach-Object {
            "$($_.FullName.Substring((Get-Location).Path.Length + 1)) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          } | Set-Content diagnostic-evidence/build-before.txt
      - name: Apply test-only instrumentation after immutable build
        run: |
          Copy-Item ../diagnostic/tests/performance/desktop.benchmark.spec.ts tests/performance/desktop.benchmark.spec.ts
          Copy-Item ../diagnostic/tests/helpers/streaming-timeline-diagnostic.ts tests/helpers/streaming-timeline-diagnostic.ts
          node ../diagnostic/scripts/diagnostics/verify-323-streaming-source.mjs after
          if ($LASTEXITCODE -ne 0) { throw "Invalid post-instrumentation source evidence" }
          git diff -- tests/performance/desktop.benchmark.spec.ts | Set-Content diagnostic-evidence/instrumentation.diff
          Get-FileHash tests/helpers/streaming-timeline-diagnostic.ts | Format-List | Out-String | Set-Content diagnostic-evidence/helper-hash.txt
      - name: Run unchanged complete desktop benchmark command
        run: npm run benchmark:desktop:built
      - name: Verify production bundle stayed immutable
        if: always()
        run: |
          Get-ChildItem out -File -Recurse | Sort-Object FullName | ForEach-Object {
            "$($_.FullName.Substring((Get-Location).Path.Length + 1)) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          } | Set-Content diagnostic-evidence/build-after.txt
          if (Compare-Object (Get-Content diagnostic-evidence/build-before.txt) (Get-Content diagnostic-evidence/build-after.txt)) { throw 'Production build changed' }
          node ../diagnostic/scripts/diagnostics/verify-323-streaming-source.mjs after
          if ($LASTEXITCODE -ne 0) { throw "Invalid final source evidence" }
          if (git diff --name-only -- src package.json package-lock.json scripts playwright.benchmark.config.ts) { throw 'Production or benchmark contract changed' }
      - name: Retain diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: issue-323-streaming-attribution
          path: |
            application/diagnostic-evidence
            application/performance-results
            application/test-results/desktop-benchmark
          retention-days: 14
          if-no-files-found: warn
