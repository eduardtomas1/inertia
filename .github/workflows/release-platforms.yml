name: Release76 focused lifecycle diagnosis

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen reference tag for diagnosis only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release76-focused-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Diagnose ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ARM64 watcher
            runner: windows-11-arm
            mode: watcher
          - label: macOS ARM64 shutdown
            runner: macos-15
            mode: shutdown
          - label: macOS ARM64 Duo
            runner: macos-15
            mode: duo
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INERTIA_DIAGNOSTIC_KEEP_PASS: "1"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify production source matches the frozen candidate
        run: git diff --exit-code 3262f37a957a910fb8a50d2c3a12b8a75c125861 -- src scripts package.json package-lock.json CHANGELOG.md
      - name: Prepare Windows isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          try { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"; Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" } catch { Write-Output "Defender exclusion unavailable" }
      - name: Install reviewed dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build exact diagnostic app
        run: npm run build:packaged
      - name: Probe Windows watcher startup with fixed existing assertions
        if: matrix.mode == 'watcher'
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test tests/e2e/watcher.spec.ts --project=isolated --workers=1 --repeat-each=5 --retries=0
      - name: Probe macOS native exit with existing cleanup bounds
        if: matrix.mode == 'shutdown'
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test tests/e2e/app-update-viability.spec.ts tests/e2e/layout.spec.ts --project=isolated --workers=2 --repeat-each=10 --retries=0 -g 'the real update validator|searches Help, moves'
      - name: Probe macOS Duo ownership with fixed existing assertions
        if: matrix.mode == 'duo'
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test tests/e2e/multi-spawn.spec.ts --project=isolated --workers=2 --repeat-each=5 --retries=0
      - name: Retain focused failure and process diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release76-focused-${{ matrix.mode }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
