name: Public Linux v53 updater probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-v53-public:
    name: Exact public v53 renderer and stable feed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install native guardian toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2 xvfb
      - name: Build the outer process guardian only
        run: node scripts/build-runtime-process-guardian.mjs
      - name: Download and verify the exact public predecessor
        run: node scripts/ci/download-public-linux-v53.mjs "$RUNNER_TEMP/v53-predecessor"
      - name: Probe untouched v53 renderer and normal stable feed
        run: xvfb-run --auto-servernum node scripts/linux-public-update-probe.mjs "$RUNNER_TEMP/v53-predecessor/Inertia-0.0.53.AppImage" "$RUNNER_TEMP/v53-public-evidence"
      - name: Retain only public identity and fixed probe outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-v53-public-probe
          path: |
            ${{ runner.temp }}/v53-predecessor/predecessor.json
            ${{ runner.temp }}/v53-public-evidence/public-update-probe.json
          retention-days: 3
          if-no-files-found: warn
