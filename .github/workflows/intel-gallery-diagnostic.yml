name: Intel gallery diagnostic

on:
  push:
    branches: [codex/fix-audit-findings]

permissions:
  contents: read

concurrency:
  group: intel-gallery-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      CI: "true"
      INERTIA_E2E_WORKERS: "1"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
      - name: Verify native architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture
      - name: Build application
        run: npm run build:packaged
      - name: Prepare Electron
        run: node -e "console.log(require('electron'))"
      - name: Diagnose retained gallery image loading
        run: npm exec -- playwright test tests/e2e/attachment-gallery-visibility.spec.ts --project=display-sensitive --workers=1 --retries=0 --repeat-each=2 --output=test-results/intel-gallery
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-gallery-diagnostics
          path: test-results/intel-gallery
          if-no-files-found: warn
          retention-days: 7
