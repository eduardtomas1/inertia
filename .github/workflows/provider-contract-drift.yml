name: Diagnose frozen v55 Intel desktop performance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: Frozen v55 baseline and bounded Intel profile
    runs-on: macos-15-intel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      SOURCE_SHA: 71652cccc8c2e1cb6cee6c79c60fe4bde55440c6
      RELEASE_SOURCE_SHA: 71652cccc8c2e1cb6cee6c79c60fe4bde55440c6
      INERTIA_RELEASE_CHANNEL: stable
    steps:
      - name: Check out external diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain only benchmark instrumentation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intel-harness" "$RUNNER_TEMP/intel-evidence"
          cp tests/performance/desktop.benchmark.spec.ts "$RUNNER_TEMP/intel-harness/"
          cp tests/helpers/intel-benchmark-profile.ts "$RUNNER_TEMP/intel-harness/"
      - name: Check out immutable tagged application and baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 71652cccc8c2e1cb6cee6c79c60fe4bde55440c6
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and tag before building
        env:
          DRIVER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = d0b10ad1c01e18022b8f3b27d6f845e93e6bcfb7
          test "$(git rev-parse refs/tags/v0.0.55)" = 34131651aa847ef2ed9fbc31918424e4cac6b14f
          test "$(git rev-parse 'refs/tags/v0.0.55^{commit}')" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          writeFileSync(join(process.env.RUNNER_TEMP, 'intel-evidence/source.json'), JSON.stringify({
            sourceSha: process.env.SOURCE_SHA, driverSha: process.env.DRIVER_SHA,
            applicationBuiltBeforeOverlay: true, limitsAndSampleCountsUnchanged: true,
            limitation: 'Diagnostic rebuild, not release certification. Profiling adds overhead; baseline is uninstrumented. No publication.'
          }, null, 2));
          JS
      - name: Set up release Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build pristine application once
        run: npm run build:packaged
      - name: Prepare Electron outside benchmark deadline
        run: node -e "console.log(require('electron'))"
      - name: Measure original benchmark without profiling
        id: baseline
        continue-on-error: true
        env:
          INERTIA_DESKTOP_BENCHMARK_REPORT: ${{ runner.temp }}/intel-evidence/baseline.json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/intel-evidence/baseline-test.json
        run: |
          set -euo pipefail
          git diff --exit-code -- src package.json package-lock.json tests/performance/desktop.benchmark.spec.ts
          node node_modules/@playwright/test/cli.js test --config playwright.benchmark.config.ts --reporter=line,json --output=test-results/intel-baseline
      - name: Require completed baseline and confirmed cleanup before profiling
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'intel-evidence');
          const evidence = JSON.parse(readFileSync(join(dir, 'baseline.json'), 'utf8'));
          const result = JSON.parse(readFileSync(join(dir, 'baseline-test.json'), 'utf8'));
          assert.equal(evidence.scenarios.streamingResponsiveness.sampleCount, 3);
          assert.ok(Number.isFinite(evidence.scenarios.shutdown.coldMs));
          assert.ok(Number.isFinite(evidence.scenarios.shutdown.warmMs));
          assert.equal(result.errors.length, 0, 'Global or cleanup error blocks profiling');
          const tests = [];
          const visit = suite => { for (const spec of suite.specs ?? []) tests.push(...spec.tests); for (const child of suite.suites ?? []) visit(child); };
          for (const suite of result.suites) visit(suite);
          assert.equal(tests.length, 1);
          assert.equal(tests[0].results.length, 1, 'Retries are prohibited');
          const attempt = tests[0].results[0];
          if (process.env.BASELINE_OUTCOME === 'success') {
            assert.equal(attempt.status, 'passed');
            assert.equal(attempt.errors.length, 0);
          } else {
            assert.equal(attempt.status, 'failed');
            assert.equal(attempt.errors.length, 1, 'Multiple errors or cleanup failure blocks profiling');
            const error = attempt.errors[0];
            const location = error.location ?? attempt.errorLocation;
            assert.match(location?.file ?? '', /(?:^|\/)tests\/performance\/desktop\.benchmark\.spec\.ts$/);
            assert.ok([2181, 2234, 2236].includes(location?.line), 'Only original performance assertions permit profiling');
            assert.match(attempt.error?.message ?? '', /toBeLessThan/);
          }
          const pids = ['active', 'warm'].flatMap(key => [evidence.scenarios[key]?.runtimePid, evidence.scenarios[key]?.rendererPid]).filter(Number.isInteger);
          for (const pid of new Set(pids)) {
            try { process.kill(pid, 0); assert.fail(`Benchmark-owned PID ${pid} remains alive`); }
            catch (error) { if (error.code !== 'ESRCH') throw error; }
          }
          writeFileSync(join(dir, 'baseline-outcome.json'), JSON.stringify({ outcome: process.env.BASELINE_OUTCOME, originalThresholdsPreserved: true, cleanupConfirmed: true }));
          JS
      - name: Restore only diagnostic test overlay after pristine baseline
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/intel-harness/desktop.benchmark.spec.ts" tests/performance/
          cp "$RUNNER_TEMP/intel-harness/intel-benchmark-profile.ts" tests/helpers/
          git diff --exit-code -- src package.json package-lock.json
      - name: Capture bounded profile using unchanged workload and thresholds
        id: profiled
        continue-on-error: true
        env:
          INERTIA_V55_INTEL_PROFILE_DIR: ${{ runner.temp }}/intel-evidence/profile
          INERTIA_DESKTOP_BENCHMARK_REPORT: ${{ runner.temp }}/intel-evidence/profiled.json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/intel-evidence/profiled-test.json
        run: node node_modules/@playwright/test/cli.js test --config playwright.benchmark.config.ts --reporter=line,json --output=test-results/intel-profiled
      - name: Record diagnostic outcome without treating it as release certification
        env:
          PROFILED_OUTCOME: ${{ steps.profiled.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'intel-evidence');
          const receipt = JSON.parse(readFileSync(join(dir, 'profile/profile-receipt.json'), 'utf8'));
          const result = JSON.parse(readFileSync(join(dir, 'profiled-test.json'), 'utf8'));
          writeFileSync(join(dir, 'diagnostic-outcome.json'), JSON.stringify({
            profiledOutcome: process.env.PROFILED_OUTCOME, captureComplete: receipt.complete,
            captureFaults: receipt.faults, testStats: result.stats,
            releaseCertification: false
          }));
          JS
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-v55-bounded-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/intel-evidence
          retention-days: 7
          if-no-files-found: error
