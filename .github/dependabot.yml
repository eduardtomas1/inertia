version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 8
    versioning-strategy: increase
    commit-message:
      prefix: deps
    ignore:
      # electron-vite 5 supports Vite through v7; upgrade this pair together
      # after electron-vite declares Vite 8 compatibility.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # Babel 8 requires Node >=22.18. Keep the contributor contract at Node
      # 22 generally until raising that floor is an intentional change.
      - dependency-name: "@babel/parser"
        update-types:
          - version-update:semver-major
    groups:
      production-patch-and-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "@agentclientprotocol/sdk"
          - "@anthropic-ai/claude-agent-sdk"
          - "@anthropic-ai/sdk"
          - "@modelcontextprotocol/sdk"
          - "@opencode-ai/sdk"
      development-patch-and-minor:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 4
    commit-message:
      prefix: ci
    groups:
      actions-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
