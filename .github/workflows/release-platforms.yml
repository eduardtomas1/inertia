name: Release76 native pool control

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen reference tag; this workflow never publishes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release76-native-pool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Compare macOS ARM64 native shutdown controls
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INERTIA_CI_TIMINGS: "true"
      INERTIA_E2E_WORKERS: "2"
      EXPECTED_REFERENCE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact production and original test sources
        run: |
          test "$EXPECTED_REFERENCE_TAG" = v0.0.76
          test "$(git rev-parse refs/tags/v0.0.76^{})" = 3262f37a957a910fb8a50d2c3a12b8a75c125861
          git diff --exit-code d0c4e2ceb38fdcc86c7cb10475d54e44e61f9f4c -- src scripts package.json package-lock.json CHANGELOG.md tests/e2e
      # Actions loaded this manual, read-only graph already. Contract-test
      # file reads must still see the real unchanged candidate release graph.
      - name: Restore candidate release workflow for contract file reads
        run: |
          git show d0c4e2ceb38fdcc86c7cb10475d54e44e61f9f4c:.github/workflows/release-platforms.yml > .github/workflows/release-platforms.yml
          git diff --exit-code d0c4e2ceb38fdcc86c7cb10475d54e44e61f9f4c -- .github/workflows/release-platforms.yml src scripts package.json package-lock.json CHANGELOG.md tests/e2e
      - name: Install reviewed dependencies
        id: dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build exact candidate app with original budgets
        timeout-minutes: 10
        run: npm run build:packaged
      - name: Observe host before native control
        run: node tests/support/release76-host-observation.mjs before-control
      - name: Compare direct and Playwright native controls before product scenarios
        timeout-minutes: 5
        run: node tests/support/release76-native-control.mjs before-targets
      - name: Observe host before original product scenarios
        run: node tests/support/release76-host-observation.mjs before-targets
      - name: Probe original affected files with original worker and exit bounds
        timeout-minutes: 25
        run: >-
          node node_modules/@playwright/test/cli.js test
          tests/e2e/file-git-editor.spec.ts tests/e2e/html-render.spec.ts
          tests/e2e/limit-reset.spec.ts tests/e2e/palette.spec.ts
          tests/e2e/project-add-selection.spec.ts
          --project=isolated --output=test-results/native-targets
          --workers=2 --repeat-each=3 --retries=0 --max-failures=1
      - name: Observe host after scenarios or failure
        if: always() && steps.dependencies.outcome == 'success'
        run: node tests/support/release76-host-observation.mjs after-targets-or-failure
      - name: Compare controls after scenarios or failure
        if: always() && steps.dependencies.outcome == 'success'
        timeout-minutes: 5
        run: node tests/support/release76-native-control.mjs after-targets
      - name: Retain native failures and matched controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release76-native-pool-${{ github.run_attempt }}
          path: |
            test-results
            ci-test-timings
          if-no-files-found: warn
          retention-days: 7
