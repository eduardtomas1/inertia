name: Intel native guardian phase diagnostic

on:
  workflow_dispatch:
    inputs:
      standalone_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-kimi:
    name: Inspect Intel Mac guardian cleanup
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies
        if: inputs.standalone_only != true
        uses: ./.github/actions/install-dependencies
      - name: Build the native application bundle
        if: inputs.standalone_only != true
        run: npm run build:packaged
      - name: Prepare Electron binary
        if: inputs.standalone_only != true
        run: node -e "console.log(require('electron'))"
      - name: Repeat Kimi with its neighboring isolated fixture
        if: inputs.standalone_only != true
        run: npm exec -- playwright test tests/e2e/kimi-terminal-auth.spec.ts tests/e2e/core-bridge-smoke.spec.ts --project=isolated --repeat-each=6 --max-failures=1 --output=test-results/macos-kimi
      - name: Compare private Apple Git and resolved toolchain metadata
        if: always()
        run: python3 scripts/ci/measure-intel-git-guardian.py
      - name: Upload synthetic fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-kimi-native-phase
          path: test-results/macos-kimi
          retention-days: 3
          if-no-files-found: warn
