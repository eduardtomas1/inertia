name: Snapshot prepared quit diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepared-quit:
    name: Frozen 3ca macOS ARM64 isolated shutdown diagnostic
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: "true"
      INERTIA_E2E_WORKERS: "2"
    defaults:
      run:
        working-directory: source/inertia
    steps:
      - name: Check out reviewed diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: driver
      - name: Check out frozen application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3ca1ba81dc241e51de7e368327e420bd03482cb9
          fetch-depth: 0
          persist-credentials: false
          path: source/inertia
      - name: Verify exact source and driver-only overlay
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path.cwd()
          driver = source.parents[1] / 'driver'
          frozen = '3ca1ba81dc241e51de7e368327e420bd03482cb9'
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args]).decode().strip()
          assert git(source, 'rev-parse', 'HEAD') == frozen
          assert git(driver, 'rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert not git(source, 'status', '--porcelain')
          allowed = {'.github/workflows/provider-contract-drift.yml', 'tests/e2e/activity.spec.ts', 'docs/SNAPSHOT_3CA_QUIT_DIAGNOSTIC.md'}
          assert set(git(driver, 'diff', '--name-only', frozen, 'HEAD').splitlines()) == allowed
          assert git(source, 'hash-object', 'package-lock.json') == git(driver, 'hash-object', 'package-lock.json')
          report = {'sourceSha': frozen, 'sourceTree': git(source, 'rev-parse', 'HEAD^{tree}'), 'driverSha': os.environ['GITHUB_SHA'], 'driverTree': git(driver, 'rev-parse', 'HEAD^{tree}'), 'runId': os.environ['GITHUB_RUN_ID'], 'lockSha256': hashlib.sha256((source/'package-lock.json').read_bytes()).hexdigest(), 'overlayFiles': ['tests/e2e/activity.spec.ts'], 'isolatedWorkers': 2, 'retries': 0, 'retainedChildExitMs': 5000}
          (source/'diagnostic-proof').mkdir()
          (source/'diagnostic-proof/identity.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
      - name: Set up locked Node 22 runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/inertia/.nvmrc
      - name: Install exact locked application dependencies
        run: npm ci
      - name: Verify native dependencies and guardian
        env:
          INERTIA_EXPECTED_ARCH: arm64
        run: |
          npm run test:native-architecture
          npm run pretest
      - name: Build untouched frozen application
        run: |
          npm run build:packaged
          git diff --exit-code
      - name: Apply only the reviewed test observation
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          source = pathlib.Path.cwd()
          driver = source.parents[1] / 'driver'
          relative = pathlib.Path('tests/e2e/activity.spec.ts')
          shutil.copyfile(driver/relative, source/relative)
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert changed == [relative.as_posix()]
          built = sorted(p for p in (source/'out').rglob('*') if p.is_file())
          assert built
          report = {'files': [{'path': str(p.relative_to(source)), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in built], 'testOverlaySha256': hashlib.sha256((source/relative).read_bytes()).hexdigest()}
          (source/'diagnostic-proof/build-and-overlay.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
      - name: Run original isolated suite order once with unchanged assertions
        run: npm exec -- playwright test --project=isolated --output=test-results/isolated
      - name: Verify production bytes remain untouched after test
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          source = pathlib.Path.cwd()
          proof = source/'diagnostic-proof/build-and-overlay.json'
          if not proof.exists():
              raise SystemExit('Setup did not reach a built candidate; no product test result is claimed.')
          report = json.loads(proof.read_text())
          assert subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines() == ['tests/e2e/activity.spec.ts']
          for entry in report['files']:
              assert hashlib.sha256((source/entry['path']).read_bytes()).hexdigest() == entry['sha256'], entry['path']
          print('Frozen production bytes unchanged; test-only diagnostic overlay retained.')
          PY
      - name: Preserve bounded trace and source proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-3ca-prepared-quit-macos-arm64
          path: |
            source/inertia/diagnostic-proof
            source/inertia/test-results
          if-no-files-found: error
          retention-days: 7
