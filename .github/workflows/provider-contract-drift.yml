name: Windows v54 runtime cleanup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime-cleanup:
    name: Observe immediate stop and workspace cleanup
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
      INERTIA_WINDOWS_RUNTIME_CLEANUP_DIAGNOSTIC: "1"
    steps:
      - name: Check out isolated diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact product source and diagnostic-only changes
        shell: pwsh
        run: |
          $base = 'ae58b5c425ccd1d708fef912070dd1047f344840'
          if ($env:GITHUB_REPOSITORY -ne 'eduardtomas1/inertia' -or $env:GITHUB_REF -ne 'refs/heads/codex/validation-windows-v54-runtime-cleanup') { throw 'Unexpected diagnostic scope' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Missing exact source parent' }
          $allowed = @('.github/workflows/provider-contract-drift.yml', 'scripts/diagnostics/windows-runtime-cleanup-snapshot.cs', 'scripts/diagnostics/run-windows-runtime-cleanup.ps1', 'tests/support/windows-runtime-cleanup-diagnostic.ts', 'tests/support/runtime-test-cleanup.ts', 'tests/server/runtime.test.ts')
          $changed = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin $allowed }).Count -ne 0) { throw 'Changes outside diagnostic-only allowlist' }
          git diff --exit-code $base HEAD -- src native resources package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Product source differs from exact failing revision' }
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match native CI temporary directories
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Match native CI Defender exclusions
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install locked dependencies
        run: npm ci
      - name: Build existing native runtime helpers
        run: npm run pretest
      - name: Compile bounded read-only metadata helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostic-results/tools | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\diagnostics\windows-runtime-cleanup-snapshot.cs'
          $output = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-results\tools\cleanup-snapshot.exe'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /optimize+ /target:exe /reference:System.Web.Extensions.dll "/out:$output" $source
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic helper compilation failed' }
      - name: Runtime integration sequence 1 of 5
        id: sample1
        if: ${{ !cancelled() && success() }}
        continue-on-error: true
        shell: pwsh
        env:
          INERTIA_DIAGNOSTIC_ATTEMPT: "1"
        run: ./scripts/diagnostics/run-windows-runtime-cleanup.ps1
      - name: Runtime integration sequence 2 of 5
        id: sample2
        if: ${{ !cancelled() && success() }}
        continue-on-error: true
        shell: pwsh
        env:
          INERTIA_DIAGNOSTIC_ATTEMPT: "2"
        run: ./scripts/diagnostics/run-windows-runtime-cleanup.ps1
      - name: Runtime integration sequence 3 of 5
        id: sample3
        if: ${{ !cancelled() && success() }}
        continue-on-error: true
        shell: pwsh
        env:
          INERTIA_DIAGNOSTIC_ATTEMPT: "3"
        run: ./scripts/diagnostics/run-windows-runtime-cleanup.ps1
      - name: Runtime integration sequence 4 of 5
        id: sample4
        if: ${{ !cancelled() && success() }}
        continue-on-error: true
        shell: pwsh
        env:
          INERTIA_DIAGNOSTIC_ATTEMPT: "4"
        run: ./scripts/diagnostics/run-windows-runtime-cleanup.ps1
      - name: Runtime integration sequence 5 of 5
        id: sample5
        if: ${{ !cancelled() && success() }}
        continue-on-error: true
        shell: pwsh
        env:
          INERTIA_DIAGNOSTIC_ATTEMPT: "5"
        run: ./scripts/diagnostics/run-windows-runtime-cleanup.ps1
      - name: Preserve every iteration's outcome
        if: always()
        shell: pwsh
        env:
          SAMPLE1: ${{ steps.sample1.outcome }}
          SAMPLE2: ${{ steps.sample2.outcome }}
          SAMPLE3: ${{ steps.sample3.outcome }}
          SAMPLE4: ${{ steps.sample4.outcome }}
          SAMPLE5: ${{ steps.sample5.outcome }}
        run: |
          $results = @($env:SAMPLE1, $env:SAMPLE2, $env:SAMPLE3, $env:SAMPLE4, $env:SAMPLE5)
          Write-Output ($results -join ',')
          if (@($results | Where-Object { $_ -ne 'success' }).Count -gt 0) { throw 'At least one repetition failed or did not run; a later pass cannot erase failure' }
      - name: Upload bounded synthetic fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-v54-runtime-cleanup
          path: |
            diagnostic-results/attempt-*.json
            diagnostic-results/attempt-*.log
            diagnostic-results/attempt-*/cleanup-failure.json
          retention-days: 3
          if-no-files-found: warn
