name: Windows action stop diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-action-stop:
    name: Repeat immediate managed action stop
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match Windows CI temporary directories
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Match Windows CI Defender exclusions
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install locked dependencies
        run: npm ci
      - name: Build native runtime helpers
        run: npm run pretest
      - name: Repeat the unchanged immediate stop regression
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path diagnostic-results | Out-Null
          $failures = 0
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Output "Attempt $attempt of 10"
            npm exec -- vitest run tests/server/runtime.test.ts --maxWorkers=1 --testNamePattern="controls only the exact managed project action and persists a safe rerun identity" --reporter=default --reporter=json --outputFile.json="diagnostic-results/attempt-$attempt.json" 2>&1 | Tee-Object -FilePath "diagnostic-results/attempt-$attempt.log"
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          Write-Output "$failures of 10 attempts failed"
          if ($failures -gt 0) { exit 1 }
      - name: Upload synthetic fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-action-stop-diagnostic
          path: diagnostic-results
          retention-days: 3
          if-no-files-found: warn
