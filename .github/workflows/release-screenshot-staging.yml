name: Release screenshot staging

on:
  push:
    branches:
      - codex/release-0.0.47

permissions:
  contents: read

jobs:
  canary:
    name: Capture v0.0.47 Canary screenshot
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build the application bundle
        run: npm run build

      - name: Capture exact Canary release surface
        env:
          INERTIA_CANARY_SCREENSHOT_PATH: ${{ runner.temp }}/inertia-canary-channel.png
        run: >-
          npm exec -- playwright test tests/e2e/canary-channel.spec.ts
          --project=isolated
          --grep "renders the Canary channel"
          --workers=1

      - name: Upload exact screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inertia-0.0.47-canary-screenshot
          path: ${{ runner.temp }}/inertia-canary-channel.png
          if-no-files-found: error
          retention-days: 2
