name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Migrations, architecture, lint, and types are platform independent, so they
  # are proven once here instead of six times across the matrix. Every
  # expensive job depends on this, which keeps a typo from occupying the
  # Windows, macOS, and ARM runner pools that the rest of the matrix queues on.
  gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify migrations, architecture, lint, and types
        run: npm run check:quality

  node-22-minimum:
    name: Node 22.13 minimum runtime
    runs-on: ubuntu-24.04
    needs: gate
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      # Deliberately uncached: proving that npm ci itself resolves and installs
      # the locked graph on exactly Node 22.13 is this job's whole purpose, and
      # restoring a tree built elsewhere would prove nothing.
      - name: Install locked dependencies without a cache
        run: npm ci --engine-strict

      - name: Compile and execute Node runtime entry points
        run: npm run check:node-runtime

  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    needs: gate
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
            arch: x64
            timeout_minutes: 40
            package_script: package:linux
            app_path: release/linux-unpacked/inertia
            unpacked_dir: release/linux-unpacked
            docker_platform: linux/amd64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            timeout_minutes: 55
            package_script: package:linux:arm64
            app_path: release/linux-arm64-unpacked/inertia
            unpacked_dir: release/linux-arm64-unpacked
            docker_platform: linux/arm64
          - label: Windows x64
            runner: windows-2025
            artifact: windows-x64
            arch: x64
            timeout_minutes: 55
            release_platform: windows-x64
            release_package_script: package:release:win
            app_path: release/win-unpacked/Inertia.exe
          - label: Windows ARM64
            runner: windows-11-arm
            artifact: windows-arm64
            arch: arm64
            timeout_minutes: 70
            release_platform: windows-arm64
            release_package_script: package:release:win:arm64
            app_path: release/win-arm64-unpacked/Inertia.exe
          - label: macOS arm64
            runner: macos-15
            artifact: macos-arm64
            arch: arm64
            timeout_minutes: 40
            release_platform: macos-arm64
            release_package_script: package:release:mac
            app_path: release/mac-arm64/Inertia.app
          - label: macOS x64
            runner: macos-15-intel
            artifact: macos-x64
            arch: x64
            timeout_minutes: 55
            release_platform: macos-x64
            release_package_script: package:release:mac:x64
            app_path: release/mac/Inertia.app
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-${{ matrix.artifact }}.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-${{ matrix.artifact }}.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-${{ matrix.artifact }}.json

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Real-time scanning inspects every file npm writes and every executable
      # the native Git, SQLite, and PTY fixtures spawn, which is the dominant
      # cost of both installing and testing on the hosted Windows images. The
      # runner user is an administrator and the workspace is discarded when the
      # job ends, so the exclusion is scoped to that throwaway tree.
      - name: Exclude the workspace from Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install Linux guardian toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run test:native-architecture

      - name: Run cross-platform performance smoke
        run: npm run benchmark:platform:smoke

      # Migrations, architecture, lint, and types are already proven by the
      # quality gate, so each platform runs only what is genuinely platform
      # dependent: the unit suite and the build.
      - name: Run the unit suite
        if: runner.os == 'macOS'
        run: npm test

      # Coverage runs the same suite as npm test, so Linux runs it once here
      # instead of running the suite twice.
      - name: Run the unit suite and enforce all-source coverage baselines
        if: runner.os == 'Linux'
        run: npm run test:coverage

      # The sharded Windows unit job already runs this whole suite on the same
      # windows-2025 image, so repeating it here would only duplicate it. The
      # ARM64 image has no sharded job, which makes it the only Windows unit
      # signal for that architecture.
      - name: Run portable runtime and provider protocol suite
        if: runner.os != 'Windows' || matrix.arch != 'x64'
        run: npm run test:portable

      - name: Run opt-in Kimi through Claude integration
        if: runner.os == 'Linux'
        shell: bash
        env:
          INERTIA_KIMI_CODE_API_KEY: ${{ secrets.INERTIA_KIMI_CODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INERTIA_KIMI_CODE_API_KEY:-}" ]]; then
            echo "Kimi integration secret is unavailable; ordinary CI remains secret-free."
            exit 0
          fi
          INERTIA_RUN_KIMI_CLAUDE_INTEGRATION=1 \
            npm exec -- vitest run tests/server/kimi-claude-real-smoke.test.ts

      - name: Verify native Windows Codex discovery and shim launching
        if: runner.os == 'Windows'
        run: npm run test:windows-codex

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --audit-level=high

      # The one build in the job. It carries the generated third-party notices
      # and the runtime guardian that packaging requires, but not the typecheck
      # the quality gate already ran. Everything below consumes this output, so
      # the packaging steps no longer rebuild it from source.
      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Run display-sensitive Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      # Keep this as a separate step with an explicit status condition: an
      # assertion in the display-sensitive phase must fail the job without
      # preventing the independent coverage from running.
      - name: Run isolated Electron end-to-end tests
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && runner.os != 'Linux' }}
        run: npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run display-sensitive Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      - name: Run isolated Electron end-to-end tests under Xvfb
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Keep provider settings visual evidence
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-settings-screenshots
          path: test-results/**/provider-settings-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Measure desktop workloads
        if: runner.os != 'Linux'
        run: npm run benchmark:desktop:built

      - name: Measure desktop workloads under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run benchmark:desktop:built

      - name: Package native Windows installer and unpacked app
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package native macOS containers and unpacked app
        if: runner.os == 'macOS'
        env:
          # The builder is configured for ad-hoc signing (identity "-"), so no
          # signing secret is exposed by enabling it for pull-request builds.
          CSC_FOR_PULL_REQUEST: "true"
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package Linux AppImage and unpacked app
        if: runner.os == 'Linux'
        run: npm run "${{ matrix.package_script }}"

      - name: Validate Linux AppImage identity, icons, and runtime resource
        if: runner.os == 'Linux'
        run: npm run validate:linux-package

      - name: Verify the packaged Linux guardian is static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          guardian="${{ matrix.unpacked_dir }}/resources/runtime/runtime-process-guardian"
          test -x "$guardian"
          if readelf --program-headers "$guardian" | grep -Fq 'INTERP'; then
            echo "The packaged Linux guardian unexpectedly has a program interpreter." >&2
            exit 1
          fi
          if readelf --dynamic "$guardian" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "The packaged Linux guardian unexpectedly has a dynamic dependency." >&2
            exit 1
          fi

      - name: Verify packaged Electron fuses
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app_path }}"
          test -e "$app"
          npm run verify:fuses -- "$app"

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Install, smoke, and uninstall Windows package
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: npm run test:windows-installer-smoke

      - name: Prove AppImage and guardian runtime on pristine Ubuntu 22.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print0)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi
          artifact="$(basename -- "${appimages[0]}")"
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --volume "$PWD/release:/release:ro" \
            ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -euo pipefail -c '
              app="/release/$1"
              "$app" --appimage-version
              work="$(mktemp -d)"
              cd "$work"
              "$app" --appimage-extract >/dev/null
              guardian="squashfs-root/resources/runtime/runtime-process-guardian"
              test -x "$guardian"
              "$guardian" seccomp-selftest
              sleep 30 & child="$!"
              cleanup() {
                kill "$child" 2>/dev/null || true
                wait "$child" 2>/dev/null || true
              }
              trap cleanup EXIT
              identity="$("$guardian" identity "$child")"
              [[ "$identity" =~ ^[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*$ ]]
            ' bash "$artifact"

      - name: Configure Linux sandbox helper for smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${{ matrix.unpacked_dir }}/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"

      - name: Smoke native packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package-smoke

      - name: Smoke final macOS and Linux release containers
        if: runner.os == 'macOS'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: npm run test:release-container-smoke

      - name: Smoke final Linux AppImage default and fallback launches under Xvfb
        if: runner.os == 'Linux'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: xvfb-run --auto-servernum npm run test:release-container-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mac_app="${{ matrix.app_path }}"
          codesign --verify --deep --strict --verbose=2 "$mac_app"

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ matrix.artifact }}
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep cross-platform performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.artifact }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 14

  windows-unit:
    name: Windows unit tests (${{ matrix.shard }}/4)
    runs-on: windows-2025
    needs: gate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Vitest shards by path hash rather than by measured duration, so two
      # shards drifted apart by roughly a third. Four shards narrow that spread
      # and shorten the longest shard, which is what the pull-request loop
      # actually waits on. Each shard remains single-worker because #74 proved
      # that concurrent hosted-Windows fixtures contend for native resources.
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exclude the workspace from Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Windows unit-test shard
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-windows-unit-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
