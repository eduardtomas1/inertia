name: PR321 installed Windows turn-start diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-turn:
    name: Observe exact installed upgrade once
    runs-on: windows-2025
    # Keep the failing lane's outer budget and all per-scenario bounds intact.
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-windows-x64.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-windows-x64.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-windows-x64.json
    steps:
      - name: Check out exact failed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3be5a9ce64f776969ebc23f87a44ad52c70a4641
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed diagnostic driver separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-driver
          fetch-depth: 0
          persist-credentials: false
      - name: Match native CI temporary fixture location
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Match disposable native CI Defender exclusions
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install the exact source dependency graph
        uses: ./.github/actions/install-dependencies
      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture
      - name: Preserve original platform benchmark prefix
        run: npm run benchmark:platform:smoke
      - name: Preserve native Codex discovery prefix
        run: npm run test:windows-codex
      - name: Build native helper
        run: npm run pretest
      - name: Build exact unchanged application
        run: npm run build:packaged
      - name: Package exact unchanged candidate
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: windows-x64
        run: npm run package:release:win
      - name: Download original checksummed public predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/ci/download-windows-n-minus-one.mjs --current-version 0.0.54 --channel stable --architecture x64 --output-directory release/n-minus-one
      - name: Verify packaged Electron fuses
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:fuses -- release/win-unpacked/Inertia.exe
      - name: Smoke unchanged unpacked candidate
        run: npm run test:package-smoke
      - name: Verify source and inject failure-only smoke observer after packaging
        run: node diagnostic-driver/scripts/diagnostics/prepare-pr321-installed-turn.mjs
      - name: Run original installed predecessor and candidate sequence once
        id: installed
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_WINDOWS_N_MINUS_ONE_METADATA: release/n-minus-one/metadata.json
        run: npm run test:windows-installer-smoke
      - name: Preserve outcome independently of profile cleanup
        if: always()
        env:
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        run: |
          New-Item -ItemType Directory -Force diagnostic-results | Out-Null
          [ordered]@{
            schema = 1
            source = '3be5a9ce64f776969ebc23f87a44ad52c70a4641'
            driver = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            installedOutcome = $env:INSTALLED_OUTCOME
          } | ConvertTo-Json | Set-Content -Path diagnostic-results/outcome.json
      - name: Preserve bounded synthetic fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr321-installed-turn-windows-x64
          path: |
            diagnostic-results
            performance-results
          if-no-files-found: warn
          retention-days: 5
