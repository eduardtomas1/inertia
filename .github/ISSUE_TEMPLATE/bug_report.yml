name: Bug report
description: Report a reproducible problem without exposing private workspace data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Inertia. This form is public and may be indexed permanently.

        Do not include credentials, tokens, private prompts, proprietary source code, repository names, account identifiers, full local paths, or unredacted raw logs, screenshots, recordings, or diagnostic archives. Use a throwaway repository and replace identifying values with neutral placeholders.

        When the app opens, its built-in **Copy diagnostic report** output is designed for public bug intake: it excludes prompts, source content, token values, credentials, and provider capabilities. You must still review it and redact any remaining identifier before posting it below.

        Security vulnerabilities must be reported through the private process in the [security policy](https://github.com/eduardtomas1/inertia/security/policy), not here.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and preparation
      options:
        - label: I searched existing issues and tested the latest tagged release.
          required: true
        - label: I reproduced this with a throwaway or fully sanitized repository and account.
          required: true
        - label: I removed secrets, private source or prompts, repository and account names, full paths, and identifying log content.
          required: true
        - label: This is a product bug, not a security vulnerability.
          required: true

  - type: input
    id: version
    attributes:
      label: Inertia version
      description: Use the tagged version shown in the app or release name.
      placeholder: "0.0.12"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider or harness
      description: Do not include account, organization, endpoint, or model identifiers.
      options:
        - Codex app-server
        - Claude Agent SDK
        - Cursor ACP
        - OpenCode SDK
        - Local runtime or Git
        - Renderer or desktop shell
        - Packaging or update
        - Unknown or not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe observable behavior in your own words. Do not paste a full log, transcript, prompt, diff, or diagnostic bundle.
      placeholder: A concise description with private values replaced by placeholders.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: List the smallest steps using a throwaway repository. Include only synthetic file names and content.
      placeholder: |
        1. Create an empty temporary repository.
        2. Add a text file containing "example".
        3. Start...
    validations:
      required: true

  - type: textarea
    id: diagnostic_report
    attributes:
      label: Reviewed privacy-safe diagnostic report
      description: In Inertia, open Settings → Runtime diagnostics → Copy diagnostic report. Paste that built-in report here after reviewing and redacting any remaining identifier. It excludes prompts, source content, token values, credentials, and provider capabilities. If the app did not open far enough to copy it, state that instead. Do not substitute raw logs, terminal output, database files, or an unredacted diagnostic archive.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittent
        - Happened once
    validations:
      required: true

  - type: input
    id: regression
    attributes:
      label: Last known working version
      description: Leave blank if unknown. Do not include private project history.
      placeholder: "0.0.11"

  - type: textarea
    id: safe_context
    attributes:
      label: Additional sanitized context
      description: Optional. Prefer a short error category or UI description. The reviewed built-in report belongs in the field above. Do not attach raw logs, screenshots, recordings, archives, database files, or source code unless a maintainer asks and you can fully redact them.

  - type: checkboxes
    id: final_review
    attributes:
      label: Final privacy review
      options:
        - label: I reviewed every field and attachment once more and confirmed that this public report contains no sensitive or identifying data.
          required: true
