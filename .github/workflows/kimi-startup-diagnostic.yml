name: Darwin Kimi startup diagnostic

on:
  push:
    branches:
      - codex/diagnose-kimi-guardian-55

permissions:
  contents: read

concurrency:
  group: diagnostic-kimi-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Native Intel full release context attribution
    runs-on: macos-15-intel
    timeout-minutes: 85
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INERTIA_RELEASE_CHANNEL: stable
      # These instrumented packages belong to this diagnostic commit, never the release tag.
      RELEASE_SOURCE_SHA: ${{ github.sha }}
      INERTIA_BENCHMARK_REPORT: performance-results/platform-macos-x64.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-macos-x64.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-macos-x64.json
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source and diagnostic-only delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bd55066f2c2beb655f21a9eabf73460101a38cdd"
          git merge-base --is-ancestor 5c9dc929b2ecfcd228b4a013fa770c0683e6108f HEAD
          git diff --exit-code 86b8402b37c500f1b464a962a00bc53c6b55a833 HEAD -- . ':!.github/workflows/kimi-startup-diagnostic.yml' ':!tests/main/cross-platform-packaged-behavior.test.ts'
          git diff --exit-code 5c9dc929b2ecfcd228b4a013fa770c0683e6108f HEAD -- tests/e2e/kimi-terminal-auth.spec.ts package.json package-lock.json playwright.config.ts native/runtime-process-guardian .github/workflows/release-platforms.yml
          mkdir -p diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/diagnostic-source.txt
          git diff --stat 5c9dc929b2ecfcd228b4a013fa770c0683e6108f HEAD > diagnostic-evidence/instrumentation-delta.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture

      - name: Run release-candidate platform performance guard
        run: npm run benchmark:platform:smoke

      - name: Enforce the isolated browser-evidence CPU budget
        run: npm run test:browser-evidence-cpu-budget

      - name: Run the complete release unit suite
        if: runner.os != 'Windows'
        run: |
          # Keep native fixture contention aligned with PR CI.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm test -- --maxWorkers=2
          else
            npm test
          fi

      - name: Build the release application bundle once
        id: application_bundle
        run: npm run build:packaged

      - name: Build macOS release package
        if: runner.os == 'macOS'
        env:
          PACKAGE_SCRIPT: package:release:mac:x64
          INERTIA_RELEASE_PLATFORM: macos-x64
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              unset "$name"
            fi
          done
          npm run "$PACKAGE_SCRIPT"

      - name: Verify packaged Electron fuses
        run: |
          set -euo pipefail
          app="release/mac/Inertia.app"
          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            case "$RUNNER_OS" in
              Linux) app="${app%/inertia}/inertia-canary" ;;
              Windows) app="${app%/Inertia.exe}/Inertia Canary.exe" ;;
              macOS) app="${app%/Inertia.app}/Inertia Canary.app" ;;
              *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi
          test -e "$app"
          npm run verify:fuses -- "$app"

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Smoke final macOS and Linux release containers
        if: runner.os == 'macOS'
        run: npm run test:release-container-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mac_app="release/mac/Inertia.app"
          if [[ "$INERTIA_RELEASE_CHANNEL" == canary ]]; then
            mac_app="${mac_app%/Inertia.app}/Inertia Canary.app"
          fi
          codesign --verify --deep --strict --verbose=2 "$mac_app"
          if [[ -n "${CSC_LINK:-}" ]]; then
            codesign --display --verbose=2 "$mac_app" 2>&1 | grep -q "Authority=Developer ID Application:"
            xcrun stapler validate "$mac_app"
          fi

      - name: Measure release-candidate desktop workloads
        if: runner.os != 'Linux'
        run: npm run benchmark:desktop:built

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run display-sensitive Electron end-to-end tests
        if: runner.os != 'Linux'
        env:
          INERTIA_DIAG_KIMI_GUARDIAN: "1"
        run: |
          set -euo pipefail
          npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive 2>&1 | tee diagnostic-evidence/display-sensitive.log

      - name: Run isolated Electron end-to-end tests
        if: runner.os != 'Linux'
        env:
          INERTIA_DIAG_KIMI_GUARDIAN: "1"
          # Bound Windows load after hosted socket-buffer exhaustion.
          INERTIA_E2E_WORKERS: ${{ runner.os == 'Windows' && '1' || '2' }}
        run: |
          set -euo pipefail
          npm exec -- playwright test --project=isolated --output=test-results/isolated 2>&1 | tee diagnostic-evidence/isolated.log

      - name: Run destructive runtime-recovery tests sequentially
        if: runner.os != 'Linux'
        env:
          INERTIA_DIAG_KIMI_GUARDIAN: "1"
        run: |
          set -euo pipefail
          npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery 2>&1 | tee diagnostic-evidence/runtime-recovery.log

      # No tag, release staging, publication, signing credentials, or release-asset uploads.
      - name: Keep diagnostic performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-full-context-performance
          path: performance-results
          if-no-files-found: warn
          retention-days: 7
      - name: Keep diagnostic native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-full-context-native
          path: |
            diagnostic-evidence
            test-results
          if-no-files-found: error
          retention-days: 7
