name: PR315 Windows attachment enablement diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attachment-enablement:
    name: Observe original Windows x64 runtime recovery once
    runs-on: windows-2025
    # Keep the failing lane's outer budget and all per-scenario bounds intact.
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-windows-x64.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-windows-x64.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-windows-x64.json
    steps:
      - name: Check out exact failed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: de8a45abaaaae269478ed3c787cbfc4a9ee9ee7c
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed diagnostic driver separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-driver
          fetch-depth: 0
          persist-credentials: false
      - name: Match native CI temporary fixture location
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Match disposable native CI Defender exclusions
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Install the exact source dependency graph
        uses: ./.github/actions/install-dependencies
      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture
      - name: Build unchanged source before test instrumentation
        run: npm run build:packaged
      - name: Prepare Electron binary outside the original hook budget
        run: node -e "console.log(require('electron'))"
      - name: Verify source identities and apply failure-only test observation
        run: node diagnostic-driver/scripts/diagnostics/prepare-pr315-attach-enablement.mjs
      - name: Run the same four runtime-recovery scenarios once in original order
        id: recovery
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery
      - name: Preserve the original group's outcome
        if: always()
        env:
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          New-Item -ItemType Directory -Force diagnostic-results | Out-Null
          [ordered]@{
            schema = 1
            source = 'de8a45abaaaae269478ed3c787cbfc4a9ee9ee7c'
            driver = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            recoveryOutcome = $env:RECOVERY_OUTCOME
          } | ConvertTo-Json | Set-Content -Path diagnostic-results/outcome.json
      - name: Preserve bounded synthetic fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr315-attach-enablement-windows-x64
          path: |
            diagnostic-results
            test-results/runtime-recovery
          if-no-files-found: warn
          retention-days: 5
