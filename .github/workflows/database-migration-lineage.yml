name: Database migration lineage

on:
  workflow_call:
    inputs:
      comparison-base:
        description: Proven comparison ancestor; unavailable main evidence compares complete history.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lineage:
    name: Reject released migration tamper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve authoritative comparison commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPARISON_BASE: ${{ inputs.comparison-base }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$COMPARISON_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            git merge-base --is-ancestor "$COMPARISON_BASE" HEAD
            comparison="$COMPARISON_BASE"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags origin "$BASE_REF"
            comparison="$(git merge-base HEAD "origin/$BASE_REF")"
          elif [[ "$EVENT_NAME" == merge_group ]] && [[ "$MERGE_GROUP_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            comparison="$MERGE_GROUP_BASE_SHA"
          else
            comparison=""
          fi
          printf 'commit=%s\n' "$comparison" >> "$GITHUB_OUTPUT"

      - name: Reject edited, removed, or reordered released migrations
        env:
          COMPARISON_BASE: ${{ steps.base.outputs.commit }}
        run: |
          if [[ -n "$COMPARISON_BASE" ]]; then
            node scripts/verify-database-lineage.mjs --base-ref "$COMPARISON_BASE"
          else
            node scripts/verify-database-lineage.mjs --all-history
          fi

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Recompute semantic migration digests
        run: npm exec -- vitest run tests/server/database-migration-lineage.test.ts tests/main/database-lineage-gate.test.ts
