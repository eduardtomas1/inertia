name: Release76 desktop sequence diagnosis

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Frozen reference tag for diagnosis only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release76-focused-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Diagnose ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ARM64 desktop sequence
            runner: windows-11-arm
            mode: windows-context
            workers: 1
          - label: macOS ARM64 desktop sequence
            runner: macos-15
            mode: macos-context
            workers: 2
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INERTIA_DIAGNOSTIC_KEEP_PASS: "1"
      INERTIA_CI_TIMINGS: "true"
      INERTIA_E2E_WORKERS: ${{ matrix.workers }}
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify production source matches the frozen candidate
        run: git diff --exit-code 3262f37a957a910fb8a50d2c3a12b8a75c125861 -- src scripts package.json package-lock.json CHANGELOG.md
      - name: Prepare Windows isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
          try { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"; Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" } catch { Write-Output "Defender exclusion unavailable" }
      - name: Install reviewed dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build exact diagnostic app
        run: npm run build:packaged
      - name: Observe host before the desktop sequence
        run: node -e 'const os=require("node:os");console.log(JSON.stringify({at:Date.now(),phase:"before-desktop",memoryFree:os.freemem(),memoryTotal:os.totalmem(),load:os.loadavg(),cpus:os.availableParallelism()}))'
      - name: Match release desktop benchmark precondition
        timeout-minutes: 10
        run: npm run benchmark:desktop:built
      - name: Match release foreground phase before isolated apps
        timeout-minutes: 25
        run: node node_modules/@playwright/test/cli.js test --project=display-sensitive --output=test-results/display-sensitive --retries=0
      - name: Observe host before the isolated sequence
        run: node -e 'const os=require("node:os");console.log(JSON.stringify({at:Date.now(),phase:"before-isolated",memoryFree:os.freemem(),memoryTotal:os.totalmem(),load:os.loadavg(),cpus:os.availableParallelism()}))'
      - name: Probe complete isolated sequence with release worker and deadline settings
        timeout-minutes: 45
        run: node node_modules/@playwright/test/cli.js test --project=isolated --output=test-results/isolated --retries=0
      - name: Retain focused failure and process diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release76-focused-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            test-results
            ci-test-timings
            performance-results
          if-no-files-found: warn
          retention-days: 7
