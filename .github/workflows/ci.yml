name: CI (non-release)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
            timeout_minutes: 40
          - label: Windows x64
            runner: windows-2025
            artifact: windows-x64
            timeout_minutes: 55
          - label: macOS arm64
            runner: macos-15
            artifact: macos-arm64
            timeout_minutes: 40
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-${{ matrix.artifact }}.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-${{ matrix.artifact }}.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-${{ matrix.artifact }}.json

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run cross-platform performance smoke
        run: npm run benchmark:platform:smoke

      - name: Typecheck, unit test, and build
        if: runner.os != 'Windows'
        run: npm run check

      - name: Typecheck and build the Windows platform gate
        if: >-
          runner.os == 'Windows'
          && !startsWith(github.head_ref, 'codex/release-')
        run: npm run check:platform

      - name: Run the complete Windows release-candidate gate
        if: >-
          runner.os == 'Windows'
          && startsWith(github.head_ref, 'codex/release-')
        run: npm run check

      - name: Run portable runtime and provider protocol suite
        run: npm run test:portable

      - name: Enforce all-source coverage baselines
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Run opt-in Kimi through Claude integration
        if: runner.os == 'Linux'
        shell: bash
        env:
          INERTIA_KIMI_CODE_API_KEY: ${{ secrets.INERTIA_KIMI_CODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INERTIA_KIMI_CODE_API_KEY:-}" ]]; then
            echo "Kimi integration secret is unavailable; ordinary CI remains secret-free."
            exit 0
          fi
          INERTIA_RUN_KIMI_CLAUDE_INTEGRATION=1 \
            npm exec -- vitest run tests/server/kimi-claude-real-smoke.test.ts

      - name: Verify native Windows Codex discovery and shim launching
        if: runner.os == 'Windows'
        run: npm run test:windows-codex

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm exec -- playwright test

      - name: Run Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test

      - name: Measure desktop workloads
        if: runner.os != 'Linux'
        run: npm run benchmark:desktop:built

      - name: Measure desktop workloads under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run benchmark:desktop:built

      - name: Build non-release contributor Windows package
        if: runner.os == 'Windows'
        run: npm run dist:contributor-ci:dir

      - name: Build non-release contributor macOS package
        if: runner.os == 'macOS'
        env:
          # The builder is configured for ad-hoc signing (identity "-"), so no
          # signing secret is exposed by enabling it for pull-request builds.
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run dist:contributor-ci:dir

      - name: Build non-release contributor Linux package
        if: runner.os == 'Linux'
        run: npm run dist:contributor-ci:linux

      - name: Validate Linux AppImage identity, icons, and runtime resource
        if: runner.os == 'Linux'
        run: npm run validate:linux-package

      - name: Verify packaged Electron fuses
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) app="release/linux-unpacked/inertia" ;;
            Windows) app="release/win-unpacked/Inertia.exe" ;;
            macOS) app="release/mac-arm64/Inertia.app" ;;
            *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          npm run verify:fuses -- "$app"

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Configure Linux sandbox helper for smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%u:%g:%a' release/linux-unpacked/chrome-sandbox)" = "0:0:4755"

      - name: Smoke native packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mac_app="release/mac-arm64/Inertia.app"
          codesign --verify --deep --strict --verbose=2 "$mac_app"

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ matrix.artifact }}
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep cross-platform performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.artifact }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 14

  windows-unit:
    name: Windows unit tests (${{ matrix.shard }}/2)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Vitest keeps each Windows shard on one worker so native Git, SQLite,
      # and WebSocket fixtures remain isolated exactly as they are today.
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Windows unit-test shard
        run: npm test -- --shard=${{ matrix.shard }}/2

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-windows-unit-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
