name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      all_evidence: ${{ steps.changes.outputs.all_evidence }}
      full_certification: ${{ steps.changes.outputs.full_certification }}
      documentation_only: ${{ steps.changes.outputs.documentation_only }}
      quality_shared: ${{ steps.changes.outputs.quality_shared }}
      runtime_supervisor: ${{ steps.changes.outputs.runtime_supervisor }}
      process_containment: ${{ steps.changes.outputs.process_containment }}
      startup_recovery: ${{ steps.changes.outputs.startup_recovery }}
      provider_common: ${{ steps.changes.outputs.provider_common }}
      provider_codex: ${{ steps.changes.outputs.provider_codex }}
      provider_claude: ${{ steps.changes.outputs.provider_claude }}
      provider_cursor: ${{ steps.changes.outputs.provider_cursor }}
      provider_kimi: ${{ steps.changes.outputs.provider_kimi }}
      provider_opencode: ${{ steps.changes.outputs.provider_opencode }}
      turn_session: ${{ steps.changes.outputs.turn_session }}
      agent_management: ${{ steps.changes.outputs.agent_management }}
      database_migrations: ${{ steps.changes.outputs.database_migrations }}
      terminal_native: ${{ steps.changes.outputs.terminal_native }}
      updater: ${{ steps.changes.outputs.updater }}
      windows_packaging: ${{ steps.changes.outputs.windows_packaging }}
      linux_appimage: ${{ steps.changes.outputs.linux_appimage }}
      macos_packaging: ${{ steps.changes.outputs.macos_packaging }}
      renderer_ui: ${{ steps.changes.outputs.renderer_ui }}
      performance: ${{ steps.changes.outputs.performance }}
      ci_test_infrastructure: ${{ steps.changes.outputs.ci_test_infrastructure }}
      domains_json: ${{ steps.changes.outputs.domains_json }}

    steps:
      - name: Check out complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed evidence domains
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-classifier.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  # Migrations, architecture, lint, and types are platform independent, so they
  # are proven once here instead of six times across the matrix. Every
  # expensive job depends on this, which keeps a typo from occupying the
  # Windows, macOS, and ARM runner pools that the rest of the matrix queues on.
  gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow syntax and expressions
        shell: bash
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$binary" -color

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify migrations, architecture, lint, and types
        run: npm run check:quality

  node-22-minimum:
    name: Node 22.13 minimum runtime
    runs-on: ubuntu-24.04
    needs: gate
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      # Deliberately uncached: proving that npm ci itself resolves and installs
      # the locked graph on exactly Node 22.13 is this job's whole purpose, and
      # restoring a tree built elsewhere would prove nothing.
      - name: Install locked dependencies without a cache
        run: npm ci --engine-strict

      - name: Compile and execute Node runtime entry points
        run: npm run check:node-runtime

  pr-linux-core:
    name: PR Linux core and portable conformance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux guardian toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run core suite with all-source coverage baselines
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Keep core failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-linux-core-results
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  pr-linux-lifecycle:
    name: PR Linux x64 AppImage and lifecycle sentinel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux guardian toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Run Linux lifecycle and AppImage update sentinels
        run: >-
          npm exec -- vitest run --maxWorkers=1
          tests/main/app-update-handoff.test.ts
          tests/main/app-update-install.test.ts
          tests/main/app-update.test.ts
          tests/main/appimage-installed-identity.test.ts
          tests/main/runtime-owned-process-update-recovery.test.ts
          tests/main/runtime-process-containment-admission.test.ts
          tests/main/runtime-recovery-integration.test.ts
          tests/main/runtime-supervisor-lifecycle.test.ts
          tests/server/runtime-shutdown-authority.test.ts

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run destructive runtime-recovery Electron sentinels under Xvfb
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Package Linux x64 AppImage and unpacked app
        run: npm run package:linux

      - name: Validate Linux AppImage identity, icons, and runtime resource
        run: npm run validate:linux-package

      - name: Verify the packaged Linux guardian is static
        shell: bash
        run: |
          set -euo pipefail
          guardian="release/linux-unpacked/resources/runtime/runtime-process-guardian"
          test -x "$guardian"
          if readelf --program-headers "$guardian" | grep -Fq 'INTERP'; then
            echo "The packaged Linux guardian unexpectedly has a program interpreter." >&2
            exit 1
          fi
          if readelf --dynamic "$guardian" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "The packaged Linux guardian unexpectedly has a dynamic dependency." >&2
            exit 1
          fi

      - name: Verify packaged Electron fuses
        run: npm run verify:fuses -- release/linux-unpacked/inertia

      - name: Configure Linux sandbox helper for smoke
        shell: bash
        run: |
          set -euo pipefail
          sandbox="release/linux-unpacked/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"

      - name: Smoke packaged Linux app and final AppImage under Xvfb
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: |
          xvfb-run --auto-servernum npm run test:package-smoke
          xvfb-run --auto-servernum npm run test:release-container-smoke

      - name: Keep Linux sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-linux-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  pr-windows-lifecycle:
    name: PR Windows x64 lifecycle sentinel
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exclude the workspace from Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: x64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Run Windows lifecycle sentinels
        run: >-
          npm exec -- vitest run --maxWorkers=1
          tests/main/app-update-handoff.test.ts
          tests/main/runtime-owned-process-recovery.test.ts
          tests/main/runtime-process-containment-admission.test.ts
          tests/main/runtime-supervisor-lifecycle.test.ts
          tests/main/runtime-supervisor-windows-tree-recovery.test.ts
          tests/main/windows-runtime-job.test.ts
          tests/server/runtime-shutdown-authority.test.ts

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run destructive runtime-recovery Electron sentinels
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep Windows sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-windows-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  pr-macos-lifecycle:
    name: PR macOS arm64 lifecycle sentinel
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    needs: [classify, gate]
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: arm64
        run: npm run test:native-architecture

      - name: Build native runtime helpers
        run: npm run pretest

      - name: Run macOS lifecycle sentinels
        run: >-
          npm exec -- vitest run --maxWorkers=1
          tests/main/app-update-handoff.test.ts
          tests/main/runtime-live-darwin-recovery.test.ts
          tests/main/runtime-owned-process-darwin-helper.test.ts
          tests/main/runtime-process-guardian-darwin.test.ts
          tests/main/runtime-supervisor-lifecycle.test.ts
          tests/main/terminal-darwin-ownership-boundary.test.ts
          tests/main/terminal-darwin-shutdown.test.ts
          tests/server/runtime-shutdown-authority.test.ts

      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run destructive runtime-recovery Electron sentinels
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep macOS sentinel failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-macos-lifecycle-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request' || needs.classify.outputs.full_certification == 'true'
    runs-on: ${{ matrix.runner }}
    needs: [classify, gate]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
            arch: x64
            timeout_minutes: 40
            package_script: package:linux
            app_path: release/linux-unpacked/inertia
            unpacked_dir: release/linux-unpacked
            docker_platform: linux/amd64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            timeout_minutes: 55
            package_script: package:linux:arm64
            app_path: release/linux-arm64-unpacked/inertia
            unpacked_dir: release/linux-arm64-unpacked
            docker_platform: linux/arm64
          - label: Windows x64
            runner: windows-2025
            artifact: windows-x64
            arch: x64
            timeout_minutes: 55
            release_platform: windows-x64
            release_package_script: package:release:win
            app_path: release/win-unpacked/Inertia.exe
          - label: Windows ARM64
            runner: windows-11-arm
            artifact: windows-arm64
            arch: arm64
            timeout_minutes: 70
            release_platform: windows-arm64
            release_package_script: package:release:win:arm64
            app_path: release/win-arm64-unpacked/Inertia.exe
          - label: macOS arm64
            runner: macos-15
            artifact: macos-arm64
            arch: arm64
            timeout_minutes: 40
            release_platform: macos-arm64
            release_package_script: package:release:mac
            app_path: release/mac-arm64/Inertia.app
          - label: macOS x64
            runner: macos-15-intel
            artifact: macos-x64
            arch: x64
            timeout_minutes: 55
            release_platform: macos-x64
            release_package_script: package:release:mac:x64
            app_path: release/mac/Inertia.app
    env:
      CI: "true"
      INERTIA_BENCHMARK_REPORT: performance-results/platform-${{ matrix.artifact }}.json
      INERTIA_DESKTOP_BENCHMARK_REPORT: performance-results/desktop-${{ matrix.artifact }}.json
      INERTIA_PACKAGE_BENCHMARK_REPORT: performance-results/package-${{ matrix.artifact }}.json

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Real-time scanning inspects every file npm writes and every executable
      # the native Git, SQLite, and PTY fixtures spawn, which is the dominant
      # cost of both installing and testing on the hosted Windows images. The
      # runner user is an administrator and the workspace is discarded when the
      # job ends, so the exclusion is scoped to that throwaway tree.
      - name: Exclude the workspace from Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install Linux guardian toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes binutils linux-libc-dev musl-tools=1.2.4-2

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Verify native dependency architecture
        env:
          INERTIA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npm run test:native-architecture

      - name: Run cross-platform performance smoke
        if: github.event_name != 'pull_request' || needs.classify.outputs.performance == 'true'
        run: npm run benchmark:platform:smoke

      # Migrations, architecture, lint, and types are already proven by the
      # quality gate, so each platform runs only what is genuinely platform
      # dependent: the unit suite and the build.
      - name: Run the unit suite
        if: runner.os == 'macOS'
        run: npm test

      # Coverage runs the same suite as npm test, so Linux runs it once here
      # instead of running the suite twice.
      - name: Run the unit suite and enforce all-source coverage baselines
        if: runner.os == 'Linux'
        run: npm run test:coverage

      # Linux coverage, macOS units, and the sharded Windows x64 job already
      # execute every marked portable test. Windows ARM64 has no complete unit
      # signal, so it alone needs the generated portable subset here.
      - name: Run Windows ARM64 portable runtime and provider protocol suite
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: npm run test:portable

      - name: Run opt-in Kimi through Claude integration
        if: runner.os == 'Linux'
        shell: bash
        env:
          INERTIA_KIMI_CODE_API_KEY: ${{ secrets.INERTIA_KIMI_CODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${INERTIA_KIMI_CODE_API_KEY:-}" ]]; then
            echo "Kimi integration secret is unavailable; ordinary CI remains secret-free."
            exit 0
          fi
          INERTIA_RUN_KIMI_CLAUDE_INTEGRATION=1 \
            npm exec -- vitest run tests/server/kimi-claude-real-smoke.test.ts

      - name: Verify native Windows Codex discovery and shim launching
        if: runner.os == 'Windows'
        run: npm run test:windows-codex

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Report complete dependency audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm audit --audit-level=high

      # The one build in the job. It carries the generated third-party notices
      # and the runtime guardian that packaging requires, but not the typecheck
      # the quality gate already ran. Everything below consumes this output, so
      # the packaging steps no longer rebuild it from source.
      - name: Build the application bundle
        id: application_bundle
        run: npm run build:packaged

      # The shared dependency cache deliberately excludes Electron's platform
      # payload. Download it outside Playwright's hook deadline so a cold cache
      # cannot consume the first display-sensitive suite's startup budget.
      - name: Prepare Electron end-to-end binary
        id: electron_test_binary
        run: node -e "console.log(require('electron'))"

      - name: Run display-sensitive Electron end-to-end tests
        if: runner.os != 'Linux'
        run: npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      # Keep this as a separate step with an explicit status condition: an
      # assertion in the display-sensitive phase must fail the job without
      # preventing the independent coverage from running.
      - name: Run isolated Electron end-to-end tests
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && steps.electron_test_binary.outcome == 'success' && runner.os != 'Linux' }}
        run: npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run destructive runtime-recovery tests sequentially
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && steps.electron_test_binary.outcome == 'success' && runner.os != 'Linux' }}
        run: npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Run display-sensitive Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=display-sensitive --output=test-results/display-sensitive

      - name: Run isolated Electron end-to-end tests under Xvfb
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && steps.electron_test_binary.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=isolated --output=test-results/isolated

      - name: Run destructive runtime-recovery tests sequentially under Xvfb
        if: ${{ !cancelled() && steps.application_bundle.outcome == 'success' && steps.electron_test_binary.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm exec -- playwright test --project=runtime-recovery --output=test-results/runtime-recovery

      - name: Keep provider settings visual evidence
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-settings-screenshots
          path: test-results/**/provider-settings-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Measure desktop workloads
        if: (github.event_name != 'pull_request' || needs.classify.outputs.performance == 'true') && runner.os != 'Linux'
        run: npm run benchmark:desktop:built

      - name: Measure desktop workloads under Xvfb
        if: (github.event_name != 'pull_request' || needs.classify.outputs.performance == 'true') && runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run benchmark:desktop:built

      - name: Package native Windows installer and unpacked app
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package native macOS containers and unpacked app
        if: runner.os == 'macOS'
        env:
          # The builder is configured for ad-hoc signing (identity "-"), so no
          # signing secret is exposed by enabling it for pull-request builds.
          CSC_FOR_PULL_REQUEST: "true"
          INERTIA_RELEASE_CHANNEL: stable
          INERTIA_RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: npm run "${{ matrix.release_package_script }}"

      - name: Package Linux AppImage and unpacked app
        if: runner.os == 'Linux'
        run: npm run "${{ matrix.package_script }}"

      - name: Validate Linux AppImage identity, icons, and runtime resource
        if: runner.os == 'Linux'
        run: npm run validate:linux-package

      - name: Verify the packaged Linux guardian is static
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          guardian="${{ matrix.unpacked_dir }}/resources/runtime/runtime-process-guardian"
          test -x "$guardian"
          if readelf --program-headers "$guardian" | grep -Fq 'INTERP'; then
            echo "The packaged Linux guardian unexpectedly has a program interpreter." >&2
            exit 1
          fi
          if readelf --dynamic "$guardian" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "The packaged Linux guardian unexpectedly has a dynamic dependency." >&2
            exit 1
          fi

      - name: Verify packaged Electron fuses
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.app_path }}"
          test -e "$app"
          npm run verify:fuses -- "$app"

      - name: Smoke native packaged app
        if: runner.os != 'Linux'
        run: npm run test:package-smoke

      - name: Install, smoke, and uninstall Windows package
        if: runner.os == 'Windows'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: npm run test:windows-installer-smoke

      - name: Prove AppImage and guardian runtime on pristine Ubuntu 22.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print0)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi
          artifact="$(basename -- "${appimages[0]}")"
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            --volume "$PWD/release:/release:ro" \
            ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -euo pipefail -c '
              app="/release/$1"
              "$app" --appimage-version
              work="$(mktemp -d)"
              cd "$work"
              "$app" --appimage-extract >/dev/null
              guardian="squashfs-root/resources/runtime/runtime-process-guardian"
              test -x "$guardian"
              "$guardian" seccomp-selftest
              sleep 30 & child="$!"
              cleanup() {
                kill "$child" 2>/dev/null || true
                wait "$child" 2>/dev/null || true
              }
              trap cleanup EXIT
              identity="$("$guardian" identity "$child")"
              [[ "$identity" =~ ^[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*\|[1-9][0-9]*$ ]]
            ' bash "$artifact"

      - name: Configure Linux sandbox helper for smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${{ matrix.unpacked_dir }}/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"

      - name: Smoke native packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package-smoke

      - name: Smoke final macOS and Linux release containers
        if: runner.os == 'macOS'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: npm run test:release-container-smoke

      - name: Smoke final Linux AppImage default and fallback launches under Xvfb
        if: runner.os == 'Linux'
        env:
          INERTIA_RELEASE_CHANNEL: stable
        run: xvfb-run --auto-servernum npm run test:release-container-smoke

      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mac_app="${{ matrix.app_path }}"
          codesign --verify --deep --strict --verbose=2 "$mac_app"

      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-${{ matrix.artifact }}
          path: |
            test-results
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep cross-platform performance evidence
        if: always() && (github.event_name != 'pull_request' || needs.classify.outputs.performance == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.artifact }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 14

  windows-unit:
    name: Windows unit tests (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || needs.classify.outputs.full_certification == 'true'
    runs-on: windows-2025
    needs: [classify, gate]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Longest-processing-time sharding uses only the bounded manifest from a
      # successful Windows run. New files get the recorded p90 duration rather
      # than an optimistic zero. Each shard remains single-worker because #74
      # proved that concurrent hosted-Windows fixtures contend for resources.
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exclude the workspace from Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run Windows unit-test shard
        run: npm run test:windows:shard -- --shard=${{ matrix.shard }}/4

      - name: Keep Windows shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results-windows-unit-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
